<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Paciente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
    <script src="/static/js/darkmode.js"></script>
    <script>
        if (!localStorage.getItem("token")) {
            window.location.href = "/login";
        }
    </script>
</head>

<body class="container-fluid py-4">
    <div class="container">

    <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-4 gap-3">
        <a href="/" class="btn btn-outline-secondary">← Volver</a>

        <div class="d-flex flex-column flex-md-row gap-2">
            <button onclick="logout()" class="btn btn-danger w-100 w-md-auto">Salir</button>

            <button class="btn btn-sm btn-secondary w-100 w-md-auto" onclick="toggleDarkMode()">
                🌙
            </button>
        </div>
    </div> 

    

    <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3 mb-3">

        <div>
            <h1 id="nombre"></h1>
            <p id="edad"></p>
        </div>

        <button class="btn btn-warning w-10 w-md-auto" onclick="mostrarEdicion()">
            Editar
        </button>

    </div>

    <div id="formEditar" style="display:none;" class="card p-4 mb-4">

            <h5>Editar paciente</h5>
            <div class="row g-2">
                <div class="col-12 col-md-4">
                    <input id="edit_nombre" class="form-control" placeholder="Nombre">
                </div>
                <div class="col-12 col-md-4">
                    <input id="edit_apellido" class="form-control" placeholder="Apellido">
                </div>
                <div class="col-12 col-md-4">
                    <input id="edit_dni" class="form-control" placeholder="DNI">
                </div>
                <div class="col-12 col-md-4">
                    <textarea id="edit_alergias" class="form-control" placeholder="Alergias"></textarea>
                </div>
            </div>

            <button class="btn btn-success mt-2" onclick="guardarEdicion()">
                Guardar cambios
            </button>

        </div>

    <h3 class="mt-4">📋 Datos médicos</h3>

    <div id="datosMedicos" class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-3"></div>

    <h3>Nuevo Turno</h3>

    <div class="card p-3 mb-3">
        <div class="row g-2">
            <div class="col-12 col-md-6">
                <input id="fechaTurno" type="datetime-local" class="form-control">
            </div>
            <div class="col-12 col-md-6">
                <input id="motivo" class="form-control" placeholder="Motivo">
            </div>
            <div class="col-12">
                <button class="btn btn-success w-100 w-md-auto" onclick="crearTurno()">
                    Crear turno
                </button>
            </div>
        </div>
    </div>


    <h3>Notas</h3>
    <div class="card p-3 mb-3">
        <div class="row g-2">
            <div class="col-12">
                <textarea id="contenidoNota" class="form-control" placeholder="Escribir nota..."></textarea>
            </div>
            <div class="col-12">
                <button class="btn btn-success w-100 w-md-auto" onclick="crearNota()">
                    Agregar nota
                </button>
            </div>
        </div>
    </div>

    <div id="timelineNotas" class="timeline"></div>

    <div class="text-center mt-4 mb-4">
        <button id="btnVerMasNotas" class="btn btn-success" onclick="mostrarMasNotas()" style="display: none;">
            Ver más notas
        </button>
    </div>

    <div class="position-fixed top-0 end-0 p-3" style="z-index: 9999">
        <div id="toast" class="toast align-items-center text-white bg-success border-0">
            <div class="d-flex">
                <div class="toast-body" id="toastBody"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <h3 class="mt-4">🧪 Análisis de sangre</h3>

    <!-- 🔹 FORM -->
    <div id="formAnalisis" class="card p-3 mb-3">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-3">
            <div class="col">
                <label for="fechaAnalisis" class="form-label small text-muted mb-1">Fecha</label>
                <input id="fechaAnalisis" type="date" class="form-control">
            </div>
            <!-- Campos de la especialidad del médico logueado, ver
                 GET /especialidades/analisis -->
            <div id="camposFormAnalisis" class="col-12 row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-3"></div>
        </div>

        <button class="btn btn-success mt-3 w-100 w-md-auto" onclick="crearAnalisis()">
            Guardar análisis
        </button>

    </div>

    <!-- 🔹 TABLA -->
    <!-- 🔹 TABLA CON SCROLL HORIZONTAL -->
    <div id="tablaAnalisisParent" class="table-responsive mt-3">
        <table class="table table-dark table-striped table-hover text-center table-edit">
            <thead>
                <tr id="theadAnalisis">
                    <th>Fecha</th>
                    <!-- columnas de la especialidad se insertan acá -->
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaAnalisis"></tbody>
        </table>
    </div>

    <br><br>

    <h3>Evolución</h3>

    <canvas id="grafico" height="100"></canvas>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <br><br>

    </div>

    <div class="modal fade" id="modalConfirm">
        <div class="modal-dialog modal-fullscreen-sm-down">
            <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Confirmar</h5>
            </div>

            <div class="modal-body" id="modalTexto"></div>

            <div class="modal-footer">
                <button class="btn btn-secondary w-100 w-md-auto" data-bs-dismiss="modal">Cancelar</button>
                <button class="btn btn-danger w-100 w-md-auto" id="btnConfirmarEliminar">Confirmar</button>
            </div>

            </div>
        </div>
    </div>

    <div class="modal fade" id="modalEditarNota" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-fullscreen-sm-down">
            <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Editar nota</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <textarea id="editNotaContenido" class="form-control" rows="6"></textarea>
            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary w-100 w-md-auto" data-bs-dismiss="modal">Cancelar</button>
                <button class="btn btn-success w-100 w-md-auto" onclick="guardarNotaEditada()">Guardar</button>
            </div>

            </div>
        </div>
    </div>

    <div class="modal fade" id="modalEliminarNota" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-fullscreen-sm-down">
            <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Eliminar nota</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                ¿Eliminar esta nota? Esta acción no se puede deshacer.
            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary w-100 w-md-auto" data-bs-dismiss="modal">Cancelar</button>
                <button class="btn btn-danger w-100 w-md-auto" onclick="confirmarEliminarNota()">Confirmar</button>
            </div>

            </div>
        </div>
    </div>


    <script>

        function logout() {
            localStorage.removeItem("token");
            window.location.href = "/login";
        }

        document.addEventListener("DOMContentLoaded", () => {
            aplicarModo(); 
        });

        document.addEventListener("DOMContentLoaded", () => {
            const btn = document.getElementById("btnConfirmarEliminar");

            btn.addEventListener("click", confirmarEliminar);
        });

        let campoActual = null;
        let chart = null;

        // Catálogo de análisis de la especialidad del médico logueado (ver
        // GET /especialidades/analisis). analisisTexto son las keys de tipo
        // texto libre (hepatograma, otros_analisis, ...); todo lo que no
        // esté ahí se trata como numérico.
        let analisisEspecialidad = [];
        let analisisTexto = new Set();

        // =========================
        // 🎨 RANGOS NORMALES
        // =========================
        // Se arma dinámicamente pidiendo /especialidades/analisis/rangos.
        // Un campo sin rango cargado (o cuyo min/max no aplica, ej. HDL solo
        // tiene piso) queda con esa punta en null; colorearValor() trata
        // null como "no comparar ese lado", no como "no colorear nada".
        let RANGOS_NORMALES = {};

        // rojo = alto, azul = bajo, verde = normal.
        // Devuelve la clase CSS a aplicar, o null si el campo no tiene
        // ningún límite cargado todavía o el valor no es numérico.
        function colorearValor(campo, valor) {
            const rango = RANGOS_NORMALES[campo];
            if (!rango || (rango.min === null && rango.max === null)) return null;

            const numero = parseFloat(valor);
            if (Number.isNaN(numero)) return null;

            if (rango.max !== null && numero > rango.max) return "valor-alto";
            if (rango.min !== null && numero < rango.min) return "valor-bajo";
            return "valor-normal";
        }

        function celdaAnalisis(campo, valor) {
            const clase = colorearValor(campo, valor);
            const claseAttr = clase ? ` class="${clase}"` : "";
            return `<td data-campo="${campo}"${claseAttr}>${valor ?? "-"}</td>`;
        }

        let limiteNotas = 3;
        function mostrarMasNotas() {
            limiteNotas += 3; // Aumentamos de a 3
            cargarPaciente(); // Volvemos a renderizar
        }

        let notasCache = [];
        let notaEditandoId = null;
        let notaEliminarId = null;

        function escapeHtml(texto) {
            const div = document.createElement("div");
            div.innerText = texto ?? "";
            return div.innerHTML;
        }

        // Arma un string "YYYY-MM-DDTHH:mm:ss" con los dígitos de la hora
        // local del navegador, sin offset/Z — mismo criterio que el input
        // datetime-local de crearTurno(): el backend lo guarda tal cual,
        // como naive, representando hora de Buenos Aires directamente.
        function fechaLocalNaiveISO(date) {
            const pad = n => String(n).padStart(2, "0");
            return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}` +
                `T${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
        }

        function formatearFecha(fecha) {
            return new Date(fecha).toLocaleString("es-AR", {
                timeZone: "America/Argentina/Buenos_Aires",
                day: "2-digit",
                month: "2-digit",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit",
                hour12: false
            });
        }

        function mostrarToast(msg, tipo="success") {
            const toastEl = document.getElementById("toast");
            const toastBody = document.getElementById("toastBody");

            toastBody.innerText = msg;

            // cambiar color
            toastEl.className = `toast align-items-center text-white bg-${tipo} border-0`;

            const toast = new bootstrap.Toast(toastEl);
            toast.show();
        }

        function crearCard(campo, titulo, valor) {

            const contenido = valor 
                ? valor 
                : "<span class='text-muted'>Sin datos</span>";

            return `
                <div class="col-md-4 mb-3">
                    <div class="card shadow-sm border-0 p-3 h-100">

                        <div class="d-flex justify-content-between align-items-center">
                            <small class="text-muted">${titulo}</small>

                            <button class="btn btn-sm btn-outline-warning"
                                onclick="editarCampo('${campo}', \`${valor || ""}\`)">
                                ✏️
                            </button>
                        </div>

                        <div class="mt-2" id="valor-${campo}">
                            ${contenido}
                        </div>

                        <div id="edit-${campo}" style="display:none;" class="mt-2">

                            <textarea class="form-control mb-2" id="input-${campo}">${valor || ""}</textarea>

                            <div class="d-flex gap-2">
                                <button class="btn btn-success btn-sm" onclick="guardarCampo('${campo}')">
                                    Guardar
                                </button>

                                <button class="btn btn-secondary btn-sm" onclick="cancelarEdicion('${campo}')">
                                    Cancelar
                                </button>
                            </div>

                        </div>

                    </div>
                </div>
            `;
        }

        function crearCardNumero(campo, titulo, valor) {

            const contenido = (valor !== null && valor !== undefined && valor !== "")
                ? valor
                : "<span class='text-muted'>Sin datos</span>";

            return `
                <div class="col-md-4 mb-3">
                    <div class="card shadow-sm border-0 p-3 h-100">

                        <div class="d-flex justify-content-between align-items-center">
                            <small class="text-muted">${titulo}</small>

                            <button class="btn btn-sm btn-outline-warning"
                                onclick="editarCampo('${campo}', \`${valor ?? ""}\`)">
                                ✏️
                            </button>
                        </div>

                        <div class="mt-2" id="valor-${campo}">
                            ${contenido}
                        </div>

                        <div id="edit-${campo}" style="display:none;" class="mt-2">

                            <input type="number" step="0.1" class="form-control mb-2" id="input-${campo}" value="${valor ?? ""}">

                            <div class="d-flex gap-2">
                                <button class="btn btn-success btn-sm" onclick="guardarCampo('${campo}')">
                                    Guardar
                                </button>

                                <button class="btn btn-secondary btn-sm" onclick="cancelarEdicion('${campo}')">
                                    Cancelar
                                </button>
                            </div>

                        </div>

                    </div>
                </div>
            `;
        }

        function crearCardSoloLectura(titulo, valor) {

            const contenido = (valor !== null && valor !== undefined && valor !== "")
                ? valor
                : "<span class='text-muted'>Sin datos</span>";

            return `
                <div class="col-md-4 mb-3">
                    <div class="card shadow-sm border-0 p-3 h-100">

                        <small class="text-muted">${titulo}</small>

                        <div class="mt-2">
                            ${contenido}
                        </div>

                    </div>
                </div>
            `;
        }

        const pacienteId = "{{ id }}";

        // Campos clínicos de la especialidad del médico logueado (ver
        // GET /especialidades/campos). Se cachea acá porque guardarCampo
        // necesita saber si un campo es de datos_clinicos (JSONB, requiere
        // mergear con lo existente) o una columna fija (PUT directo).
        let camposEspecialidad = [];
        let datosClinicosActuales = {};

        async function cargarCamposEspecialidadCatalogo() {
            const res = await fetch("/especialidades/campos", {
                headers: { "Authorization": "Bearer " + localStorage.getItem("token") }
            });
            camposEspecialidad = res.ok ? await res.json() : [];
        }

        async function cargarAnalisisEspecialidadCatalogo() {
            const headers = { "Authorization": "Bearer " + localStorage.getItem("token") };

            const [resAnalisis, resRangos] = await Promise.all([
                fetch("/especialidades/analisis", { headers }),
                fetch("/especialidades/analisis/rangos", { headers }),
            ]);

            analisisEspecialidad = resAnalisis.ok ? await resAnalisis.json() : [];
            analisisTexto = new Set(
                analisisEspecialidad.filter(c => c.tipo === "texto").map(c => c.key)
            );

            const rangosCargados = resRangos.ok ? await resRangos.json() : [];
            const rangosPorKey = Object.fromEntries(
                rangosCargados.map(r => [r.key, { min: r.valor_min, max: r.valor_max }])
            );
            // Todo campo del catálogo arranca en null/null (sin colorear);
            // se pisa con lo que haya vuelto de /rangos para las keys que sí
            // tengan un valor de referencia cargado.
            RANGOS_NORMALES = Object.fromEntries(
                analisisEspecialidad.map(c => [c.key, rangosPorKey[c.key] ?? { min: null, max: null }])
            );

            const primerNumerico = analisisEspecialidad.find(c => c.tipo !== "texto");
            campoActual = primerNumerico ? primerNumerico.key : (analisisEspecialidad[0]?.key ?? null);

            renderFormAnalisis();
            renderTheadAnalisis();
        }

        function labelConUnidad(campo) {
            return campo.unidad ? `${campo.label} (${campo.unidad})` : campo.label;
        }

        function renderFormAnalisis() {
            const contenedor = document.getElementById("camposFormAnalisis");

            contenedor.innerHTML = analisisEspecialidad.map(campo => {
                const label = labelConUnidad(campo);
                const input = campo.tipo === "texto"
                    ? `<textarea id="${campo.key}" class="form-control" rows="1"></textarea>`
                    : `<input id="${campo.key}" class="form-control">`;
                return `<div class="col">
                    <label for="${campo.key}" class="form-label small text-muted mb-1">${label}</label>
                    ${input}
                </div>`;
            }).join("");
        }

        function renderTheadAnalisis() {
            const fila = document.getElementById("theadAnalisis");
            const columnas = analisisEspecialidad.map(campo =>
                `<th onclick="cambiarGrafico('${campo.key}', this)">${campo.label}</th>`
            ).join("");

            fila.innerHTML = `<th>Fecha</th>${columnas}<th>Acciones</th>`;
        }

        async function cargarPaciente() {
            if (!camposEspecialidad.length) {
                await cargarCamposEspecialidadCatalogo();
            }
            if (!analisisEspecialidad.length) {
                await cargarAnalisisEspecialidadCatalogo();
            }

            const res = await fetch(`/pacientes/${pacienteId}`, {
                headers: {
                    "Authorization": "Bearer " + localStorage.getItem("token")
                }
            });
            const data = await res.json();
            await cargarAnalisis();

            datosClinicosActuales = data.paciente.datos_clinicos || {};

            document.getElementById("nombre").innerText =
                data.paciente.nombre + " " + data.paciente.apellido;

            document.getElementById("edad").innerText =
                "Edad: " + data.edad;

            // =========================
            // 🧠 CARGAR DATOS EN FORM EDITAR
            // =========================

            document.getElementById("edit_nombre").value = data.paciente.nombre || "";
            document.getElementById("edit_apellido").value = data.paciente.apellido || "";
            document.getElementById("edit_dni").value = data.paciente.dni || "";

            document.getElementById("edit_alergias").value = data.paciente.alergias || "";
            
            // =========================
            // 🧠 DATOS MÉDICOS (NUEVO)
            // =========================

            const datosMedicos = document.getElementById("datosMedicos");

            const cardsEspecialidad = camposEspecialidad
                .map(campo => crearCard(campo.key, campo.label, datosClinicosActuales[campo.key]))
                .join("");

            datosMedicos.innerHTML = `
                ${crearCard("alergias", "Alergias", data.paciente.alergias)}
                ${crearCard("medico_cabecera", "Médico de cabecera", data.paciente.medico_cabecera)}
                ${cardsEspecialidad}
                ${crearCardNumero("peso", "Peso (kg)", data.paciente.peso)}
                ${crearCardNumero("talla", "Talla (cm)", data.paciente.talla)}
                ${crearCardSoloLectura("IMC", data.paciente.imc)}
                ${crearCard("diagnostico_principal", "Diagnóstico principal", data.paciente.diagnostico_principal)}
                ${crearCard("ocupacion", "Ocupación", data.paciente.ocupacion)}
                ${crearCard("habitos", "Hábitos", data.paciente.habitos)}
                ${crearCard("medicacion_habitual", "Medicación habitual", data.paciente.medicacion_habitual)}
                ${crearCard("cirugias", "Cirugías", data.paciente.cirugias)}
                ${crearCard("transfusiones", "Transfusiones", data.paciente.transfusiones)}
                ${crearCard("antecedentes_personales", "Antecedentes personales", data.paciente.antecedentes_personales)}
                ${crearCard("antecedentes_familiares", "Antecedentes familiares", data.paciente.antecedentes_familiares)}
            `;

            // =========================
            // 📝 NOTAS (timeline)
            // =========================

            notasCache = data.notas;

            const timelineNotas = document.getElementById("timelineNotas");
            timelineNotas.innerHTML = "";

            data.notas.slice(0, limiteNotas).forEach(n => {

                const div = document.createElement("div");
                div.className = "timeline-item nota";

                div.innerHTML = `
                    <div class="timeline-content">

                        <div class="d-flex justify-content-between align-items-start mb-1 gap-2">
                            <strong>${formatearFecha(n.fecha)}</strong>

                            <div class="d-flex gap-2">
                                <button class="btn btn-sm btn-warning" onclick="abrirModalEditarNota(${n.id})">
                                    ✏️
                                </button>
                                <button class="btn btn-sm btn-danger" onclick="abrirModalEliminarNota(${n.id})">
                                    🗑️
                                </button>
                            </div>
                        </div>

                        <div class="nota-texto">${escapeHtml(n.contenido)}</div>

                    </div>
                `;

                timelineNotas.appendChild(div);
            });

            const btnNotas = document.getElementById("btnVerMasNotas");
            if (data.notas.length > limiteNotas) {
                btnNotas.style.display = "inline-block"; // En lugar de "block"
            } else {
                btnNotas.style.display = "none";
            }
        }

        // =========================
        // 🎨 CARDS MÉDICAS
        // =========================

        function crearCard(campo, titulo, valor) {

            const contenido = valor 
                ? valor 
                : "<span class='text-muted'>Sin datos</span>";

            return `
                <div class="col-md-4 mb-3">
                    <div class="card shadow-sm border-0 p-3 h-100">

                        <div class="d-flex justify-content-between align-items-center">
                            <small class="text-muted">${titulo}</small>

                            <button class="btn btn-sm btn-outline-warning"
                                onclick="editarCampo('${campo}', \`${valor || ""}\`)">
                                ✏️
                            </button>
                        </div>

                        <div class="mt-2" id="valor-${campo}">
                            ${contenido}
                        </div>

                        <div id="edit-${campo}" style="display:none;" class="mt-2">

                            <textarea class="form-control mb-2" id="input-${campo}">${valor || ""}</textarea>

                            <div class="d-flex gap-2">
                                <button class="btn btn-success btn-sm" onclick="guardarCampo('${campo}')">
                                    Guardar
                                </button>

                                <button class="btn btn-secondary btn-sm" onclick="cancelarEdicion('${campo}')">
                                    Cancelar
                                </button>
                            </div>

                        </div>

                    </div>
                </div>
            `;
            
        }
        cargarPaciente();


        async function crearTurno() {

            const fecha = document.getElementById("fechaTurno").value;
            const motivo = document.getElementById("motivo").value;

            if (!fecha || !motivo) {
                mostrarToast("Completá todos los campos ❌", "danger");
                return;
            }

            const turno = {
                paciente_id: Number(pacienteId), // 🔥 importante
                fecha: fecha,
                motivo: motivo
            };

            const res = await fetch("/turnos", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + localStorage.getItem("token")
                },
                body: JSON.stringify(turno)
            });

            const data = await res.json();

            if (!res.ok) {
                mostrarToast(data.detail || "Error al crear turno ❌", "danger");
                return;
            }

        async function guardarCampo(campo) {

            const valor = document.getElementById(`input-${campo}`).value.trim();

            // =========================
            // 🟡 VALIDACIONES
            // =========================

            if (!valor) {
                mostrarToast("El campo no puede estar vacío ❌", "danger");
                return;
            }

            if (campo === "dni" && !/^\d+$/.test(valor)) {
                mostrarToast("El DNI debe ser numérico ❌", "danger");
                return;
            }

            if (campo === "telefono" && valor.length < 6) {
                mostrarToast("Teléfono inválido ❌", "danger");
                return;
            }

            if ((campo === "peso" || campo === "talla") && (isNaN(valor) || Number(valor) <= 0)) {
                mostrarToast("Valor numérico inválido ❌", "danger");
                return;
            }

            // =========================
            // 🔹 REQUEST
            // =========================

            // Los campos de la especialidad viven en datos_clinicos (JSONB),
            // no son columnas propias: hay que mandar el objeto completo
            // mergeado, no solo la key que se está editando.
            const esCampoEspecialidad = camposEspecialidad.some(c => c.key === campo);

            const payload = esCampoEspecialidad
                ? { datos_clinicos: { ...datosClinicosActuales, [campo]: valor } }
                : { [campo]: (campo === "peso" || campo === "talla") ? Number(valor) : valor };

            const res = await fetch(`/pacientes/${pacienteId}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + localStorage.getItem("token")
                },
                body: JSON.stringify(payload)
            });

            const data = await res.json();

            if (!res.ok) {
                mostrarToast(data.detail || "Error ❌", "danger");
                return;
            }

            mostrarToast("Actualizado correctamente ✏️");

            cargarPaciente();
        }

        async function cargarAnalisis() {


            
            const res = await fetch(`/analisis/${pacienteId}`, {
                headers: {
                    "Authorization": "Bearer " + localStorage.getItem("token")
                }
            });
            const data = await res.json();

            const tabla = document.getElementById("tablaAnalisis");
            tabla.innerHTML = "";

            // 🔥 para gráfico (orden correcto)
            const dataOrdenada = [...data].sort((a, b) => new soloFecha(a.fecha) - new soloFecha(b.fecha));

            // 🔥 para tabla (más reciente arriba)
            const dataTabla = [...data].sort((a, b) => new soloFecha(b.fecha) - new soloFecha(a.fecha));

            dataTabla.forEach(a => {

                const row = document.createElement("tr");

                tabla.appendChild(row);

                const celdas = analisisEspecialidad
                    .map(campo => celdaAnalisis(campo.key, a[campo.key]))
                    .join("");

                row.innerHTML = `
                    <td data-campo="fecha">${soloFecha(a.fecha)}</td>
                    ${celdas}
                    <td>
                        <button class="btn btn-sm btn-warning" onclick="editarFila(this, ${a.id})">✏️</button>
                        <button class="btn btn-sm btn-success d-none" onclick="guardarFila(this, ${a.id})">💾</button>
                        <button class="btn btn-sm btn-secondary d-none" onclick="cancelarEdicionFila(this)">❌</button>
                        <button class="btn btn-sm btn-danger" onclick="abrirModalEliminar(${a.id})">🗑</button>
                    </td>
                `;

                tabla.appendChild(row);
            });

            // 🔥 SOLO UNA VEZ
            renderGrafico(dataOrdenada);
        }

        async function crearAnalisis() {

            console.log("ENTRÉ A CREAR ANALISIS");

            const fechaInput = document.getElementById("fechaAnalisis");

            // 🔥 fecha local segura (sin UTC)
            const hoy = new Date();
            const fecha = fechaInput.value || 
                hoy.getFullYear() + "-" +
                String(hoy.getMonth() + 1).padStart(2, "0") + "-" +
                String(hoy.getDate()).padStart(2, "0");

            const data = {
                paciente_id: pacienteId,
                fecha: fecha,
            };

            analisisEspecialidad.forEach(campo => {
                data[campo.key] = analisisTexto.has(campo.key)
                    ? getValueText(campo.key)
                    : getValue(campo.key);
            });

            try {

                const res = await fetch("/analisis", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + localStorage.getItem("token")
                    },
                    body: JSON.stringify(data)
                });

                if (!res.ok) {
                    mostrarToast("Error al guardar ❌", "danger");
                    return;
                }

                await new Promise(r => setTimeout(r, 150));

                await cargarAnalisis();

                // 🔥 limpiar TODO correctamente
                const form = document.getElementById("formAnalisis");

                form.querySelectorAll("input, textarea, select").forEach(el => {
                    el.value = "";
                });

                // 🔥 reset fecha a hoy
                if (fechaInput) {
                    fechaInput.value = "";
                }

                console.log("✔ Análisis guardado correctamente");

            } catch (error) {
                console.error(error);
                mostrarToast("Error inesperado al guardar ❌", "danger");
            }
        }

        function soloFecha(fecha) {
            return new Date(fecha).toLocaleDateString("es-AR");
        }

        function renderGrafico(data) {

            const ordenado = [...data].sort((a, b) => new Date(a.fecha) - new Date(b.fecha));

            const labels = ordenado.map(a => soloFecha(a.fecha));
            const valores = ordenado.map(a => {
                const numero = parseFloat(a[campoActual]);
                return Number.isNaN(numero) ? null : numero;
            });

            if (chart) chart.destroy();

            chart = new Chart(document.getElementById("grafico"), {
                type: "line",
                data: {
                    labels: labels,
                    datasets: [{
                        label: campoActual.toUpperCase(),
                        data: valores,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            labels: {
                                color: "#e2e8f0"
                            }
                        }
                    },
                    scales: {
                        x: {
                            ticks: { color: "#e2e8f0" }
                        },
                        y: {
                            ticks: { color: "#e2e8f0" }
                        }
                    }
                }
            });
        }

        function cambiarGrafico(campo, elemento) {
            // 1. Actualizar la variable global
            campoActual = campo;

            // 2. Limpiar la clase 'activo' de todos los TH
            document.querySelectorAll("th").forEach(th => th.classList.remove("activo"));

            // 3. Resaltar el elemento que recibió el click
            if (elemento) {
                elemento.classList.add("activo");
            }

            // 4. Actualizar el gráfico
            cargarAnalisis();
        }

        function editarFila(btn, id) {

            const fila = btn.closest("tr");
            fila.dataset.editando = "true";

            const celdas = fila.querySelectorAll("td[data-campo]");

            celdas.forEach(td => {

                const campo = td.dataset.campo;
                let valor = td.innerText;

                // 🔥 limpiar "-"
                if (valor === "-") valor = "";

                // 🔥 FECHA
                if (campo === "fecha") {

                    const fechaFormateada = formatoInputFecha(valor);

                    td.innerHTML = `
                        <input 
                            type="date" 
                            class="form-control form-control-sm"
                            value="${fechaFormateada}"
                        >
                    `;
                }
                // 🔥 CAMPOS DE TEXTO LARGO (texto libre)
                else if (analisisTexto.has(campo)) {
                    td.innerHTML = `
                        <textarea class="form-control form-control-sm">${valor}</textarea>
                    `;
                }

                // 🔥 CAMPOS NUMÉRICOS
                else {
                    td.innerHTML = `
                        <input type="number" class="form-control form-control-sm"
                        value="${valor}">
                    `;
                }

            });

            toggleBotones(fila, true);
        }

        async function guardarFila(btn, id) {

            const fila = btn.closest("tr");
            const celdas = fila.querySelectorAll("td[data-campo]");

            const data = {};

            celdas.forEach(td => {

                const campo = td.dataset.campo;
                const input = td.querySelector("input, textarea");

                if (!input) return;

                const valor = input.value;

                if (valor === "") return;

                if (campo === "fecha") {
                    data[campo] = valor;
                }

                // 🔥 TEXTOS (texto libre)
                else if (analisisTexto.has(campo)) {
                    data[campo] = valor;
                }

                // 🔥 NUMÉRICOS
                else {
                    data[campo] = Number(valor);
                }
            });

            console.log("Datos a guardar:", data);

            try {

                const res = await fetch(`/analisis/${id}`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + localStorage.getItem("token")
                    },
                    body: JSON.stringify(data)
                });

                if (!res.ok) {
                    mostrarToast("Error al actualizar ❌", "danger");
                    return;
                }

                mostrarToast("Actualizado correctamente ✅", "success");

                await cargarAnalisis(); // 🔥 refresca tabla

            } catch (error) {
                console.error(error);
                mostrarToast("Error inesperado ❌", "danger");
            }
        }

        function cancelarEdicionFila(btn) {
            cargarAnalisis(); // vuelve todo a estado original
        }

        function toggleBotones(fila, editando) {
            fila.querySelector(".btn-warning").classList.toggle("d-none", editando);
            fila.querySelector(".btn-success").classList.toggle("d-none", !editando);
            fila.querySelector(".btn-secondary").classList.toggle("d-none", !editando);
        }

        function formatoInputFecha(fechaTexto) {

            if (!fechaTexto || fechaTexto === "-") return "";

            // viene como dd/mm/yyyy
            const partes = fechaTexto.split("/");

            if (partes.length !== 3) return "";

            const [dia, mes, anio] = partes;

            return `${anio}-${mes.padStart(2, "0")}-${dia.padStart(2, "0")}`;
        }
