<body class="container-fluid py-4">
    <div class="container">

    <div id="formEditar" style="display:none;" class="card p-4 mb-4">

    <h3 class="mt-4">📋 Datos médicos</h3>

    <div class="card p-3 mb-3">

    <div class="text-center mt-3">

    </div>

    <h3>Notas</h3>
    <div class="card p-3 mb-3">
        <div class="row g-2">
            <div class="col-12">
                <textarea id="contenidoNota" class="form-control" placeholder="Escribir nota..."></textarea>
            </div>

    </div>

    <ul id="notas" class="list-group"></ul>

    <div class="text-center mt-4 mb-4">

            Ver más notas
        </button>
    </div>

    <div class="position-fixed top-0 end-0 p-3" style="z-index: 9999">

                <div class="toast-body" id="toastBody"></div>

    <h3 class="mt-4">🧪 Análisis de sangre</h3>

    <!-- 🔹 FORM -->

            <div class="col"><input id="pqts" class="form-control" placeholder="PQTS"></div>
            <div class="col"><input id="ferremia" class="form-control" placeholder="Ferremia"></div>

    <!-- 🔹 TABLA -->

                    <th>Fecha</th>

                    <th onclick="cambiarGrafico('nt', this)">NT</th>

                    <th onclick="cambiarGrafico('hb', this)">HB</th>
                    <th onclick="cambiarGrafico('hto', this)">HTO</th>
                    <th onclick="cambiarGrafico('vcm', this)">VCM</th>
                    <th onclick="cambiarGrafico('pqts', this)">PQTS</th>
                    <th onclick="cambiarGrafico('ferremia', this)">Ferrem</th>
                    <th onclick="cambiarGrafico('ferritina', this)">Ferrit</th>
                    <th onclick="cambiarGrafico('saturacion', this)">% Sat</th>
                    <th onclick="cambiarGrafico('tibc', this)">TIBC</th>
                    <th onclick="cambiarGrafico('epo', this)">EPO</th>
                    <th onclick="cambiarGrafico('vit_b12', this)">B12</th>
                    <th onclick="cambiarGrafico('af', this)">AF</th>
                    <th onclick="cambiarGrafico('ldh', this)">LDH</th>
                    <th onclick="cambiarGrafico('hepatograma', this)">Hep</th>
                    <th onclick="cambiarGrafico('funcion_renal', this)">Ren</th>
                    <th onclick="cambiarGrafico('tp', this)">TP</th>
                    <th onclick="cambiarGrafico('kptt', this)">KPTT</th>
                    <th onclick="cambiarGrafico('rino', this)">RIN</th>
                    <th onclick="cambiarGrafico('otros_analisis', this)">Otros</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaAnalisis"></tbody>
        </table>
    </div>

    <br><br>

    <h3>Evolución</h3>

    <canvas id="grafico" height="100"></canvas>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <br><br>

    </div>

    <div class="modal fade" id="modalConfirm">
        <div class="modal-dialog modal-fullscreen-sm-down">
            <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Confirmar</h5>
            </div>

            <div class="modal-body" id="modalTexto"></div>

            <div class="modal-footer">
                <button class="btn btn-secondary w-100 w-md-auto" data-bs-dismiss="modal">Cancelar</button>
                <button class="btn btn-danger w-100 w-md-auto" id="btnConfirmarEliminar">Confirmar</button>
            </div>

            </div>
        </div>
    </div>


    <script>

        function logout() {
            localStorage.removeItem("token");
            window.location.href = "/login";
        }

        document.addEventListener("DOMContentLoaded", () => {
            aplicarModo(); 
        });

        document.addEventListener("DOMContentLoaded", () => {
            const btn = document.getElementById("btnConfirmarEliminar");

            btn.addEventListener("click", confirmarEliminar);
        });

        let campoActual = "hb"; // default
        let chart = null;

        // =========================
        // 🎨 RANGOS NORMALES (a definir a futuro)
        // =========================
        // Estructura preparada para cargar los rangos normales de cada
        // análisis más adelante. Mientras min/max sean null, colorearValor()
        // no aplica ningún color (comportamiento actual sin cambios).
        const RANGOS_NORMALES = {
            gb: { min: null, max: null },
            nt: { min: null, max: null },
            l: { min: null, max: null },
            hb: { min: null, max: null },
            hto: { min: null, max: null },
            vcm: { min: null, max: null },
            pqts: { min: null, max: null },
            ferremia: { min: null, max: null },
            ferritina: { min: null, max: null },
            saturacion: { min: null, max: null },
            tibc: { min: null, max: null },
            epo: { min: null, max: null },
            vit_b12: { min: null, max: null },
            af: { min: null, max: null },
            ldh: { min: null, max: null },
            tp: { min: null, max: null },
            kptt: { min: null, max: null },
            rino: { min: null, max: null }
        };

        // rojo = alto, azul = bajo, verde = normal.
        // Devuelve la clase CSS a aplicar, o null si el campo no tiene rango
        // normal definido todavía o el valor no es numérico.
        function colorearValor(campo, valor) {
            const rango = RANGOS_NORMALES[campo];
            if (!rango || rango.min === null || rango.max === null) return null;

            const numero = parseFloat(valor);
            if (Number.isNaN(numero)) return null;

            if (numero > rango.max) return "valor-alto";
            if (numero < rango.min) return "valor-bajo";
            return "valor-normal";
        }

        function celdaAnalisis(campo, valor) {
            const clase = colorearValor(campo, valor);
            const claseAttr = clase ? ` class="${clase}"` : "";
            return `<td data-campo="${campo}"${claseAttr}>${valor ?? "-"}</td>`;
        }

        let limiteTurnos = 3;
        function verMasTurnos() {
            limiteTurnos += 3; // Aumentamos de a 3
            cargarPaciente();
        }

        let limiteNotas = 3;
        function mostrarMasNotas() {
            limiteNotas += 3; // Aumentamos de a 3
            cargarPaciente(); // Volvemos a renderizar
        }

        function formatearFecha(fecha) {
            return new Date(fecha).toLocaleString("es-AR", {
                timeZone: "America/Argentina/Buenos_Aires",
                day: "2-digit",
                month: "2-digit",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit",
                hour12: false
            });
        }

        function mostrarToast(msg, tipo="success") {
            const toastEl = document.getElementById("toast");
            const toastBody = document.getElementById("toastBody");

            toastBody.innerText = msg;

            // cambiar color
            toastEl.className = `toast align-items-center text-white bg-${tipo} border-0`;

            const toast = new bootstrap.Toast(toastEl);
            toast.show();
        }

        function crearCard(campo, titulo, valor) {

            const contenido = valor 
                ? valor 
                : "<span class='text-muted'>Sin datos</span>";

            return `
                <div class="col-md-4 mb-3">
                    <div class="card shadow-sm border-0 p-3 h-100">

                        <div class="d-flex justify-content-between align-items-center">
                            <small class="text-muted">${titulo}</small>

                            <button class="btn btn-sm btn-outline-warning"
                                onclick="editarCampo('${campo}', \`${valor || ""}\`)">
                                ✏️
                            </button>
                        </div>

                        <div class="mt-2" id="valor-${campo}">
                            ${contenido}
                        </div>

                        <div id="edit-${campo}" style="display:none;" class="mt-2">

                            <textarea class="form-control mb-2" id="input-${campo}">${valor || ""}</textarea>

                            <div class="d-flex gap-2">
                                <button class="btn btn-success btn-sm" onclick="guardarCampo('${campo}')">
                                    Guardar
                                </button>

                                <button class="btn btn-secondary btn-sm" onclick="cancelarEdicion('${campo}')">
                                    Cancelar
                                </button>
                            </div>

                        </div>

                    </div>
                </div>
            `;
        }

        function crearCardNumero(campo, titulo, valor) {

            const contenido = (valor !== null && valor !== undefined && valor !== "")
                ? valor
                : "<span class='text-muted'>Sin datos</span>";

            return `
                <div class="col-md-4 mb-3">
                    <div class="card shadow-sm border-0 p-3 h-100">

                        <div class="d-flex justify-content-between align-items-center">
                            <small class="text-muted">${titulo}</small>

                            <button class="btn btn-sm btn-outline-warning"
                                onclick="editarCampo('${campo}', \`${valor ?? ""}\`)">
                                ✏️
                            </button>
                        </div>

                        <div class="mt-2" id="valor-${campo}">
                            ${contenido}
                        </div>

                        <div id="edit-${campo}" style="display:none;" class="mt-2">

                            <input type="number" step="0.1" class="form-control mb-2" id="input-${campo}" value="${valor ?? ""}">

                            <div class="d-flex gap-2">
                                <button class="btn btn-success btn-sm" onclick="guardarCampo('${campo}')">
                                    Guardar
                                </button>

                                <button class="btn btn-secondary btn-sm" onclick="cancelarEdicion('${campo}')">
                                    Cancelar
                                </button>
                            </div>

                        </div>

                    </div>
                </div>
            `;
        }

        function crearCardSoloLectura(titulo, valor) {

            const contenido = (valor !== null && valor !== undefined && valor !== "")
                ? valor
                : "<span class='text-muted'>Sin datos</span>";

            return `
                <div class="col-md-4 mb-3">
                    <div class="card shadow-sm border-0 p-3 h-100">

                        <small class="text-muted">${titulo}</small>

                        <div class="mt-2">
                            ${contenido}
                        </div>

                    </div>
                </div>
            `;
        }

        const pacienteId = "{{ id }}";

        async function cargarPaciente() {
            const res = await fetch(`/pacientes/${pacienteId}`, {
                headers: {
                    "Authorization": "Bearer " + localStorage.getItem("token")
                }
            });
            const data = await res.json();
            await cargarAnalisis();

            document.getElementById("nombre").innerText =
                data.paciente.nombre + " " + data.paciente.apellido;

            document.getElementById("edad").innerText =
                "Edad: " + data.edad;

            // =========================
            // 🧠 CARGAR DATOS EN FORM EDITAR
            // =========================

            document.getElementById("edit_nombre").value = data.paciente.nombre || "";
            document.getElementById("edit_apellido").value = data.paciente.apellido || "";
            document.getElementById("edit_dni").value = data.paciente.dni || "";

            document.getElementById("edit_sangrados").value = data.paciente.sangrados || "";
            document.getElementById("edit_trombosis").value = data.paciente.trombosis || "";
            document.getElementById("edit_alergias").value = data.paciente.alergias || "";
            
            // =========================
            // 🧠 DATOS MÉDICOS (NUEVO)
            // =========================

            const datosMedicos = document.getElementById("datosMedicos");

            datosMedicos.innerHTML = `
               ${crearCard("sangrados", "Sangrados", data.paciente.sangrados)}
                ${crearCard("trombosis", "Trombosis", data.paciente.trombosis)}
                ${crearCard("alergias", "Alergias", data.paciente.alergias)}
                ${crearCard("vacunas", "Vacunas", data.paciente.vacunas)}
                ${crearCard("gestas", "Gestas", data.paciente.gestas)}
                ${crearCard("medico_cabecera", "Médico de cabecera", data.paciente.medico_cabecera)}
                ${crearCard("fim_descriptivo", "FIM descriptivo", data.paciente.fim_descriptivo)}
                ${crearCardNumero("peso", "Peso (kg)", data.paciente.peso)}
                ${crearCardNumero("talla", "Talla (cm)", data.paciente.talla)}
                ${crearCardSoloLectura("IMC", data.paciente.imc)}
                ${crearCard("diagnostico_principal", "Diagnóstico principal", data.paciente.diagnostico_principal)}
                ${crearCard("ocupacion", "Ocupación", data.paciente.ocupacion)}
                ${crearCard("habitos", "Hábitos", data.paciente.habitos)}
                ${crearCard("medicacion_habitual", "Medicación habitual", data.paciente.medicacion_habitual)}
                ${crearCard("cirugias", "Cirugías", data.paciente.cirugias)}
                ${crearCard("transfusiones", "Transfusiones", data.paciente.transfusiones)}
                ${crearCard("antecedentes_personales", "Antecedentes personales", data.paciente.antecedentes_personales)}
                ${crearCard("antecedentes_familiares", "Antecedentes familiares", data.paciente.antecedentes_familiares)}
            `;

            // =========================
            // 📅 TURNOS
            // =========================

            const contenedor = document.getElementById("timelineTurnos");
            contenedor.innerHTML = "";

            if (data.turnos.length <= limiteTurnos) {
                document.querySelector("#btnVerMas").style.display = "none";
            }

            data.turnos.slice(0, limiteTurnos).forEach(t => {

                const div = document.createElement("div");
                div.className = `timeline-item ${t.estado}`;

                div.innerHTML = `
                    <div class="timeline-content">

                        <div class="mb-1">
                            <strong>${formatearFecha(t.fecha)}</strong>
                        </div>

                        <div><strong>Motivo:</strong> ${t.motivo}</div>
                        <div><strong>Estado:</strong> ${t.estado}</div>

                        ${
                            t.estado === "atendido" ? `
                                <div><strong>Diagnóstico:</strong> ${t.diagnostico || "-"}</div>
                                <div><strong>Observaciones:</strong> ${t.observaciones || "-"}</div>
                            ` : ""
                        }

                        ${
                            t.estado === "pendiente" ? `
                                <button class="btn btn-sm btn-success mt-2" onclick="mostrarFormulario(${t.id})">
                                    Atender
                                </button>

                                <button class="btn btn-sm btn-warning mt-2 ms-2" onclick="editarTurno(${t.id}, '${t.motivo}', '${t.fecha}')">
                                    ✏️
                                </button>

                                <button class="btn btn-sm btn-danger mt-2 ms-2" onclick="eliminarTurno(${t.id})">
                                    🗑️
                                </button>

                                <!-- 🔥 FORMULARIO ATENDER -->
                                <div id="form-${t.id}" style="display:none;" class="mt-2">
                                    <input id="diag-${t.id}" class="form-control mb-1" placeholder="Diagnóstico">
                                    <input id="obs-${t.id}" class="form-control mb-1" placeholder="Observaciones">

                                    <button class="btn btn-primary btn-sm" onclick="guardarAtencion(${t.id})">
                                        Guardar
                                    </button>
                                </div>
                            ` : ""

                        }

                    </div>
                `;

                contenedor.appendChild(div);
            });
                        
            
            function mostrarToast(msg, tipo="success") {

                const toast = document.createElement("div");
                toast.className = `position-fixed bottom-0 end-0 m-3 p-3 text-white bg-${tipo}`;
                toast.style.zIndex = 9999;
                toast.innerText = msg;

                document.body.appendChild(toast);

                setTimeout(() => {
                    toast.remove();
                }, 2500);
            }

            // =========================
            // 📝 NOTAS
            // =========================

            const notas = document.getElementById("notas");
            notas.innerHTML = "";

            data.notas.slice(0, limiteNotas).forEach(n => {
                const li = document.createElement("li");
                li.className = "list-group-item bg-dark text-white border-secondary mb-1";
                li.innerHTML = `
                    <div class="d-flex justify-content-between">
                        <div><strong>Nota:</strong></div>
                        <small class="text-info">${formatearFecha(n.fecha)}</small>
                    </div>
                    <div class="mt-1">${n.contenido}</div>
                `;

                notas.appendChild(li);
            });

            const btnNotas = document.getElementById("btnVerMasNotas");
            if (data.notas.length > limiteNotas) {
                btnNotas.style.display = "inline-block"; // En lugar de "block"
            } else {
                btnNotas.style.display = "none";
            }
        }

        // =========================
        // 🎨 CARDS MÉDICAS
        // =========================

        function crearCard(campo, titulo, valor) {

            const contenido = valor 
                ? valor 
                : "<span class='text-muted'>Sin datos</span>";

            return `
                <div class="col-md-4 mb-3">
                    <div class="card shadow-sm border-0 p-3 h-100">

                        <div class="d-flex justify-content-between align-items-center">
                            <small class="text-muted">${titulo}</small>

                            <button class="btn btn-sm btn-outline-warning"
                                onclick="editarCampo('${campo}', \`${valor || ""}\`)">
                                ✏️
                            </button>
                        </div>

                        <div class="mt-2" id="valor-${campo}">
                            ${contenido}
                        </div>

                        <div id="edit-${campo}" style="display:none;" class="mt-2">

                            <textarea class="form-control mb-2" id="input-${campo}">${valor || ""}</textarea>

                            <div class="d-flex gap-2">
                                <button class="btn btn-success btn-sm" onclick="guardarCampo('${campo}')">
                                    Guardar
                                </button>

                                <button class="btn btn-secondary btn-sm" onclick="cancelarEdicion('${campo}')">
                                    Cancelar
                                </button>
                            </div>

                        </div>

                    </div>
                </div>
            `;
            
        }
        cargarPaciente();


        async function crearTurno() {

            const fecha = document.getElementById("fechaTurno").value;
            const motivo = document.getElementById("motivo").value;

            if (!fecha || !motivo) {

        async function guardarCampo(campo) {

            const valor = document.getElementById(`input-${campo}`).value.trim();

            // =========================
            // 🟡 VALIDACIONES
            // =========================

            if (!valor) {
                mostrarToast("El campo no puede estar vacío ❌", "danger");
                return;
            }

            if (campo === "dni" && !/^\d+$/.test(valor)) {
                mostrarToast("El DNI debe ser numérico ❌", "danger");
                return;
            }

            if (campo === "telefono" && valor.length < 6) {
                mostrarToast("Teléfono inválido ❌", "danger");
                return;
            }

            if ((campo === "peso" || campo === "talla") && (isNaN(valor) || Number(valor) <= 0)) {
                mostrarToast("Valor numérico inválido ❌", "danger");
                return;
            }

            // =========================
            // 🔹 REQUEST
            // =========================

            const payload = {};
            payload[campo] = (campo === "peso" || campo === "talla") ? Number(valor) : valor;

            const res = await fetch(`/pacientes/${pacienteId}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + localStorage.getItem("token")
                },
                body: JSON.stringify(payload)
            });

            const data = await res.json();

            if (!res.ok) {
                mostrarToast(data.detail || "Error ❌", "danger");
                return;
            }

            mostrarToast("Actualizado correctamente ✏️");

            cargarPaciente();
        }

                af: getValue("af"),
                ldh: getValue("ldh"),

                hepatograma: getValueText("hepatograma"),
                funcion_renal: getValueText("funcion_renal"),

                tp: getValue("tp"),
                kptt: getValue("kptt"),
                rino: getValue("rino"),

                otros_analisis: getValueText("otros_analisis")
            };

            try {

                const res = await fetch("/analisis", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + localStorage.getItem("token")
                    },
                    body: JSON.stringify(data)
                });

                if (!res.ok) {
                    mostrarToast("Error al guardar ❌", "danger");

                form.querySelectorAll("input, textarea, select").forEach(el => {

            } catch (error) {

                mostrarToast("Error inesperado al guardar ❌", "danger");

        function soloFecha(fecha) {
            return new Date(fecha).toLocaleDateString("es-AR");
        }

        function renderGrafico(data) {

            const ordenado = [...data].sort((a, b) => new Date(a.fecha) - new Date(b.fecha));

            const labels = ordenado.map(a => soloFecha(a.fecha));
            const valores = ordenado.map(a => {
                const numero = parseFloat(a[campoActual]);
                return Number.isNaN(numero) ? null : numero;
            });

            if (chart) chart.destroy();

            chart = new Chart(document.getElementById("grafico"), {
                type: "line",
                data: {
                    labels: labels,
                    datasets: [{
                        label: campoActual.toUpperCase(),
                        data: valores,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            labels: {
                                color: "#e2e8f0"
                            }
                        }
                    },
                    scales: {
                        x: {
                            ticks: { color: "#e2e8f0" }
                        },
                        y: {
                            ticks: { color: "#e2e8f0" }
                        }
                    }
                }
            });
        }

        function cambiarGrafico(campo, elemento) {
            // 1. Actualizar la variable global
            campoActual = campo;

            // 2. Limpiar la clase 'activo' de todos los TH
            document.querySelectorAll("th").forEach(th => th.classList.remove("activo"));

            // 3. Resaltar el elemento que recibió el click
            if (elemento) {
                elemento.classList.add("activo");
            }

            // 4. Actualizar el gráfico
            cargarAnalisis();
        }

        function editarFila(btn, id) {

            const fila = btn.closest("tr");
            fila.dataset.editando = "true";

            const celdas = fila.querySelectorAll("td[data-campo]");

            celdas.forEach(td => {

                const campo = td.dataset.campo;
                let valor = td.innerText;

                // 🔥 limpiar "-"
                if (valor === "-") valor = "";

                // 🔥 FECHA
                if (campo === "fecha") {

                    const fechaFormateada = formatoInputFecha(valor);

                    td.innerHTML = `
                        <input 
                            type="date" 
                            class="form-control form-control-sm"
                            value="${fechaFormateada}"
                        >
                    `;
                }
                // 🔥 CAMPOS DE TEXTO LARGO (texto libre)
                else if (["hepatograma", "funcion_renal", "otros_analisis"].includes(campo)) {
                    td.innerHTML = `
                        <textarea class="form-control form-control-sm">${valor}</textarea>
                    `;
                }

                // 🔥 CAMPOS NUMÉRICOS
                else {
                    td.innerHTML = `
                        <input type="number" class="form-control form-control-sm"
                        value="${valor}">
                    `;
                }

            });

            toggleBotones(fila, true);
        }

        async function guardarFila(btn, id) {

            const fila = btn.closest("tr");
            const celdas = fila.querySelectorAll("td[data-campo]");

            const data = {};

            celdas.forEach(td => {

                const campo = td.dataset.campo;
                const input = td.querySelector("input, textarea");

                if (!input) return;

                const valor = input.value;

                if (valor === "") return;

                if (campo === "fecha") {
                    data[campo] = valor;
                }

                // 🔥 TEXTOS (texto libre)
                else if (["hepatograma", "funcion_renal", "otros_analisis"].includes(campo)) {
                    data[campo] = valor;
                }

                // 🔥 NUMÉRICOS
                else {
                    data[campo] = Number(valor);
                }
            });

            console.log("Datos a guardar:", data);

            try {

                const res = await fetch(`/analisis/${id}`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + localStorage.getItem("token")
                    },
                    body: JSON.stringify(data)
                });

                if (!res.ok) {
                    mostrarToast("Error al actualizar ❌", "danger");
                    return;
                }

                mostrarToast("Actualizado correctamente ✅", "success");

                await cargarAnalisis(); // 🔥 refresca tabla

            } catch (error) {
                console.error(error);
                mostrarToast("Error inesperado ❌", "danger");
            }
        }

        function cancelarEdicionFila(btn) {
            cargarAnalisis(); // vuelve todo a estado original
        }

        function toggleBotones(fila, editando) {
            fila.querySelector(".btn-warning").classList.toggle("d-none", editando);
            fila.querySelector(".btn-success").classList.toggle("d-none", !editando);
            fila.querySelector(".btn-secondary").classList.toggle("d-none", !editando);
        }

        function formatoInputFecha(fechaTexto) {

            if (!fechaTexto || fechaTexto === "-") return "";

            // viene como dd/mm/yyyy
            const partes = fechaTexto.split("/");

            if (partes.length !== 3) return "";

            const [dia, mes, anio] = partes;

            return `${anio}-${mes.padStart(2, "0")}-${dia.padStart(2, "0")}`;
        }

        function confirmar(msg, callback) {

        document.getElementById("modalTexto").innerText = msg;

        const btn = document.getElementById("btnConfirmar");

        btn.onclick = () => {
            callback();
            bootstrap.Modal.getInstance(document.getElementById("modalConfirm")).hide();
        };

        new bootstrap.Modal(document.getElementById("modalConfirm")).show();
    }

    function mostrarConfirm(mensaje, callbackConfirm) {

        const modalEl = document.getElementById("confirmModal");
        const modal = new bootstrap.Modal(modalEl);

        document.getElementById("confirmText").innerText = mensaje;

        const btn = document.getElementById("confirmBtn");

        // 🔥 limpiar eventos anteriores
        btn.onclick = null;

        btn.onclick = () => {
            callbackConfirm();
            modal.hide();
        };

        modal.show();
    }
