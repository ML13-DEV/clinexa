<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/static/css/styles.css">

    <script src="/static/js/darkmode.js"></script>

    <script>
        if (!localStorage.getItem("token")) {
            window.location.href = "/login";
        }
    </script>
</head>

<body class="container-fluid py-4">
    <div class="container">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- 🔙 NAV -->
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-4 gap-3">
        <a href="/" class="btn btn-outline-secondary">← Volver</a>

        <div class="d-flex gap-2">
            <button onclick="logout()" class="btn btn-danger">Salir</button>

            <button class="btn btn-sm btn-secondary" onclick="toggleDarkMode()">
                🌙
            </button>
        </div>
    </div>

    <h2 class="mb-4">📊 Estadísticas</h2>

    <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
            <div class="card p-3 text-center">
                <div class="text-secondary small">Pacientes</div>
                <div class="fs-3" id="statPacientesTotal">-</div>
            </div>
        </div>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-12 col-lg-6">
            <div class="card p-3">
                <h6 class="text-secondary">Top 5 diagnósticos</h6>
                <canvas id="chartDiagnosticos" height="200"></canvas>
            </div>
        </div>
        <div class="col-12 col-lg-6">
            <div class="card p-3">
                <h6 class="text-secondary">Distribución por rango etario</h6>
                <canvas id="chartRangoEtario" height="200"></canvas>
            </div>
        </div>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-12 col-lg-6">
            <div class="card p-3">
                <h6 class="text-secondary">Top 5 localidades</h6>
                <canvas id="chartLocalidades" height="200"></canvas>
            </div>
        </div>
        <div class="col-12 col-lg-6">
            <div class="card p-3">
                <h6 class="text-secondary">Top 5 obras sociales</h6>
                <canvas id="chartObrasSociales" height="200"></canvas>
            </div>
        </div>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-12">
            <div class="card p-3">
                <h6 class="text-secondary">Pacientes nuevos por mes</h6>
                <canvas id="chartAltasPorMes" height="200"></canvas>
            </div>
        </div>
    </div>

    <div class="position-fixed top-0 end-0 p-3" style="z-index: 9999">
        <div id="toast" class="toast align-items-center text-white bg-success border-0">
            <div class="d-flex">
                <div class="toast-body" id="toastBody"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <script>
        function logout() {
            localStorage.removeItem("token");
            window.location.href = "/login";
        }

        document.addEventListener("DOMContentLoaded", () => {
            aplicarModo();
            cargarEstadisticas();
        });

        function mostrarToast(msg, tipo = "success") {
            const toastEl = document.getElementById("toast");
            const toastBody = document.getElementById("toastBody");
            toastBody.innerText = msg;
            toastEl.className = `toast align-items-center text-white bg-${tipo} border-0`;
            new bootstrap.Toast(toastEl).show();
        }

        function authHeaders(extra = {}) {
            return { "Authorization": "Bearer " + localStorage.getItem("token"), ...extra };
        }

        let chartDiagnosticos = null;
        let chartRangoEtario = null;
        let chartLocalidades = null;
        let chartObrasSociales = null;
        let chartAltasPorMes = null;

        function renderBarChart(actual, canvasId, labels, valores, color) {
            if (actual) actual.destroy();

            return new Chart(document.getElementById(canvasId), {
                type: "bar",
                data: {
                    labels: labels,
                    datasets: [{ data: valores, backgroundColor: color }],
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true, ticks: { precision: 0 } } },
                },
            });
        }

        async function cargarEstadisticas() {
            const res = await fetch("/pacientes/estadisticas", { headers: authHeaders() });

            if (res.status === 403) {
                // Este endpoint es solo para medicos (ej. un owner no gestiona
                // pacientes): si no tiene permiso, no tiene nada que hacer acá.
                window.location.href = "/";
                return;
            }

            if (!res.ok) {
                mostrarToast("Error al cargar estadísticas ❌", "danger");
                return;
            }

            const stats = await res.json();

            document.getElementById("statPacientesTotal").innerText = stats.total_pacientes;

            chartDiagnosticos = renderBarChart(
                chartDiagnosticos,
                "chartDiagnosticos",
                stats.top_diagnosticos.map(d => d.label),
                stats.top_diagnosticos.map(d => d.cantidad),
                "#3b82f6"
            );

            chartRangoEtario = renderBarChart(
                chartRangoEtario,
                "chartRangoEtario",
                stats.rango_etario.map(r => r.rango),
                stats.rango_etario.map(r => r.cantidad),
                "#22c55e"
            );

            chartLocalidades = renderBarChart(
                chartLocalidades,
                "chartLocalidades",
                stats.top_localidades.map(l => l.label),
                stats.top_localidades.map(l => l.cantidad),
                "#f59e0b"
            );

            chartObrasSociales = renderBarChart(
                chartObrasSociales,
                "chartObrasSociales",
                stats.top_obras_sociales.map(o => o.label),
                stats.top_obras_sociales.map(o => o.cantidad),
                "#8b5cf6"
            );

            chartAltasPorMes = renderBarChart(
                chartAltasPorMes,
                "chartAltasPorMes",
                stats.pacientes_nuevos_por_mes.map(m => m.mes),
                stats.pacientes_nuevos_por_mes.map(m => m.cantidad),
                "#14b8a6"
            );
        }
    </script>

    </div>
</body>
</html>
