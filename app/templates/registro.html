<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>DataSoma Health - Registro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            border-radius: 20px;
            padding: 30px;
            background: #111827;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .login-title {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.6rem;
            font-weight: bold;
        }

        .form-control, .form-select {
            background-color: #1f2937;
            border: none;
            color: white;
        }

        .form-control:focus, .form-select:focus {
            background-color: #1f2937;
            color: white;
            box-shadow: none;
        }

        .btn-primary {
            background-color: #3b82f6;
            border: none;
        }

        .btn-primary:hover {
            background-color: #2563eb;
        }

        .error {
            color: #f87171;
            text-align: center;
            margin-top: 10px;
        }

        .exito {
            color: #4ade80;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>

<body class="py-4">

    <div class="login-card text-center">

        <div class="mb-4 d-flex justify-content-center">
            <img src="static/img/DataSoma_Logo2.png"
                alt="DataSoma Health Logo"
                class="img-fluid"
                style="max-width: 260px; height: auto; display: block;">
        </div>

        <h3 class="login-title">Registro de médicos</h3>

        <div id="formRegistro">
            <input id="nombre" class="form-control mb-3" placeholder="Nombre completo">
            <input id="username" class="form-control mb-3" placeholder="Usuario (podés usar tu email)">
            <input id="password" type="password" class="form-control mb-3" placeholder="Contraseña">
            <select id="especialidad" class="form-select mb-3"></select>

            <button class="btn btn-primary w-100" onclick="registrar()">Registrarme</button>
        </div>

        <div id="error" class="error"></div>
        <div id="exito" class="exito" style="display:none;">
            Registro recibido. Tu cuenta va a quedar pendiente de aprobación por el administrador.
        </div>

        <div class="mt-3 small">
            <a href="/login" class="text-light">Ya tengo cuenta, ir a login</a>
        </div>

    </div>

    <script>
        async function cargarEspecialidades() {
            const res = await fetch("/especialidades");
            const especialidades = res.ok ? await res.json() : [];
            const select = document.getElementById("especialidad");
            select.innerHTML = especialidades
                .map(esp => `<option value="${esp}">${esp}</option>`)
                .join("");
        }

        async function registrar() {
            const nombre = document.getElementById("nombre").value.trim();
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            const especialidad = document.getElementById("especialidad").value;

            const errorEl = document.getElementById("error");
            errorEl.innerText = "";

            if (!nombre || !username || !password || !especialidad) {
                errorEl.innerText = "Completá todos los campos";
                return;
            }

            const res = await fetch("/registro", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ nombre, username, password, especialidad })
            });

            const data = await res.json();

            if (!res.ok) {
                errorEl.innerText = data.detail || "No se pudo completar el registro";
                return;
            }

            document.getElementById("formRegistro").style.display = "none";
            document.getElementById("exito").style.display = "block";
        }

        cargarEspecialidades();
    </script>

</body>
</html>
