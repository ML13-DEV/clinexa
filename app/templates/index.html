<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DataSoma Health - Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/static/js/darkmode.js"></script>
    <link rel="stylesheet" href="/static/css/styles.css">
    <script>
        const token = localStorage.getItem("token");
        if (!token) {
            window.location.href = "/login";
        }
    </script>

</head>
<body class="container-fluid py-4">
    <div class="container">

        <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-4 gap-3">
            <h2>DataSoma Health - Inicio</h2>

            <div class="d-flex gap-2">
                <button onclick="logout()" class="btn btn-danger">Salir</button>

                <button class="btn btn-sm btn-secondary" onclick="toggleDarkMode()">
                    🌙
                </button>
            </div>
        </div>

        <h3>📊 Dashboard</h3>

        <div id="statsResumen" class="row row-cols-1 row-cols-md-2 g-3 mb-3"></div>

        <div class="row row-cols-1 row-cols-lg-2 g-3 mb-4">
            <div class="col">
                <div class="card shadow-sm p-3 border-0">
                    <h6 class="text-muted mb-2">Top 5 diagnósticos</h6>
                    <canvas id="chartDiagnosticos" height="220"></canvas>
                </div>
            </div>
            <div class="col">
                <div class="card shadow-sm p-3 border-0">
                    <h6 class="text-muted mb-2">Distribución por rango etario</h6>
                    <canvas id="chartRangoEtario" height="220"></canvas>
                </div>
            </div>
            <div class="col">
                <div class="card shadow-sm p-3 border-0">
                    <h6 class="text-muted mb-2">Top 5 localidades</h6>
                    <canvas id="chartLocalidades" height="220"></canvas>
                </div>
            </div>
            <div class="col">
                <div class="card shadow-sm p-3 border-0">
                    <h6 class="text-muted mb-2">Top 5 obras sociales</h6>
                    <canvas id="chartObrasSociales" height="220"></canvas>
                </div>
            </div>
        </div>

        <div class="row row-cols-1 g-3 mb-4">
            <div class="col">
                <div class="card shadow-sm p-3 border-0">
                    <h6 class="text-muted mb-2">Pacientes nuevos por mes</h6>
                    <canvas id="chartAltasPorMes" height="220"></canvas>
                </div>
            </div>
        </div>

        <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3 mb-4">
            <h3>Pacientes</h3>

            <a href="/pacientes/nuevo" class="btn btn-secondary w-10 w-md-auto">
                Nuevo paciente
            </a>
        </div>
        <!-- Lista -->
        <input 
            type="text" 
            id="search" 
            class="form-control mb-3" 
            placeholder="Buscar paciente..."
        >

        <ul id="lista" class="list-group"></ul>

    </div>

    <div class="modal fade" id="modalPaciente" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-fullscreen-sm-down">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Editar Paciente</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <!-- 🔥 BODY -->
                <div class="modal-body">

                    <input id="edit_telefono" class="form-control mb-2" placeholder="Teléfono">
                    <input id="edit_localidad" class="form-control mb-2" placeholder="Localidad">

                    <input id="edit_obra_social" class="form-control mb-2" placeholder="Obra social">
                    <input id="edit_numero_afiliado" class="form-control mb-2" placeholder="Número afiliado">

                    <textarea id="edit_sangrados" class="form-control mb-2" placeholder="Sangrados"></textarea>
                    <textarea id="edit_trombosis" class="form-control mb-2" placeholder="Trombosis"></textarea>
                    <textarea id="edit_alergias" class="form-control mb-2" placeholder="Alergias"></textarea>
                    <textarea id="edit_vacunas" class="form-control mb-2" placeholder="Vacunas"></textarea>
                    <textarea id="edit_gestas" class="form-control mb-2" placeholder="Gestas"></textarea>
                    <textarea id="edit_medico_cabecera" class="form-control mb-2" placeholder="Médico de cabecera"></textarea>
                    <textarea id="edit_fim_descriptivo" class="form-control mb-2" placeholder="FIM descriptivo"></textarea>

                    <div class="row g-2 mb-2">
                        <div class="col-4">
                            <input id="edit_peso" type="number" step="0.1" class="form-control" placeholder="Peso (kg)" oninput="actualizarImcModal()">
                        </div>
                        <div class="col-4">
                            <input id="edit_talla" type="number" step="0.1" class="form-control" placeholder="Talla (cm)" oninput="actualizarImcModal()">
                        </div>
                        <div class="col-4">
                            <input id="edit_imc" class="form-control" placeholder="IMC" readonly>
                        </div>
                    </div>

                    <input id="edit_ocupacion" class="form-control mb-2" placeholder="Ocupación">
                    <textarea id="edit_diagnostico_principal" class="form-control mb-2" placeholder="Diagnóstico principal"></textarea>
                    <textarea id="edit_habitos" class="form-control mb-2" placeholder="Hábitos"></textarea>
                    <textarea id="edit_medicacion_habitual" class="form-control mb-2" placeholder="Medicación habitual"></textarea>
                    <textarea id="edit_cirugias" class="form-control mb-2" placeholder="Cirugías"></textarea>
                    <textarea id="edit_transfusiones" class="form-control mb-2" placeholder="Transfusiones"></textarea>
                    <textarea id="edit_antecedentes_personales" class="form-control mb-2" placeholder="Antecedentes personales"></textarea>
                    <textarea id="edit_antecedentes_familiares" class="form-control mb-2" placeholder="Antecedentes familiares"></textarea>

                </div>

                <!-- 🔥 FOOTER -->
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-primary" onclick="guardarEdicion()">Guardar</button>
                </div>

            </div>
        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toast" class="toast align-items-center text-bg-success border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body" id="toastBody">
                    Mensaje
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <div class="modal fade" id="confirmModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-fullscreen-sm-down">
            <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Confirmar acción</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body" id="confirmText">
                ¿Estás seguro?
            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button class="btn btn-danger" id="confirmBtn">Eliminar</button>
            </div>

            </div>
        </div>
    </div>
    
    <script>

        document.addEventListener("DOMContentLoaded", () => {
            aplicarModo();
        });

        function logout() {
            localStorage.removeItem("token");
            window.location.href = "/login";
        }

        const CANTIDAD_INICIAL_PACIENTES = 5;
        let pacientesActuales = [];
        let pacientesMostrados = CANTIDAD_INICIAL_PACIENTES;

        async function cargarPacientes(search = "") {
            const res = await fetch(`/pacientes?search=${search}`, {
                headers: {
                    "Authorization": "Bearer " + localStorage.getItem("token")
                }
            });
            pacientesActuales = await res.json();
            pacientesMostrados = CANTIDAD_INICIAL_PACIENTES;
            renderizarListaPacientes();
        }

        function renderizarListaPacientes() {
            const lista = document.getElementById("lista");

            if (pacientesActuales.length === 0) {
                lista.innerHTML = `
                    <li class="list-group-item text-center text-muted">
                        No se encontraron pacientes
                    </li>
                `;
                return;
            }
            lista.innerHTML = "";

            pacientesActuales.slice(0, pacientesMostrados).forEach(p => {
                const item = document.createElement("li");
                item.className = "list-group-item";
                item.innerHTML = `
                    <div class="d-flex justify-content-between align-items-center">

                        <div onclick="verPaciente(${p.id})" style="cursor:pointer;">
                            <strong>${p.nombre} ${p.apellido}</strong><br>
                            <small>DNI: ${p.dni}</small>
                        </div>

                        <div>
                            <button class="btn btn-sm btn-warning" onclick="editarPaciente(${p.id})">✏️</button>
                            <button class="btn btn-sm btn-danger" onclick="eliminarPaciente(${p.id})">🗑️</button>
                        </div>

                    </div>
                `;

                /*item.onclick = () => {
                    window.location.href = `/paciente/${p.id}`;
                };*/

                lista.appendChild(item);
            });

            const restantes = pacientesActuales.length - pacientesMostrados;
            if (restantes > 0) {
                const item = document.createElement("li");
                item.className = "list-group-item text-center";
                item.innerHTML = `
                    <a href="#" onclick="mostrarMasPacientes(); return false;">
                        Ver más pacientes (${restantes} más)
                    </a>
                `;
                lista.appendChild(item);
            }
        }

        function mostrarMasPacientes() {
            pacientesMostrados = pacientesActuales.length;
            renderizarListaPacientes();
        }

        document.getElementById("search").addEventListener("input", (e) => {
            cargarPacientes(e.target.value);
        });

            const paciente = {
                nombre: document.getElementById("nombre").value,
                apellido: document.getElementById("apellido").value,
                dni: document.getElementById("dni").value,

            };

            // 🔹 1. fetch
            const res = await fetch("/pacientes", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(paciente)
            });

            // 🔹 2. leer respuesta
            const data = await res.json();

            // 🔹 3. manejar error (ACÁ VA)

                return;
            }

            // 🔹 4. éxito
            mostrarToast("Paciente creado correctamente ✅");

            document.getElementById("nombre").value = "";

            document.getElementById("dni").value = "";
            document.getElementById("fecha").value = "";

            // 🔹 6. refrescar lista
            cargarPacientes();
        }*/


        let graficosStats = {};

        function colorTextoChart() {
            return document.body.classList.contains("dark-mode") ? "#e2e8f0" : "#334155";
        }

        function colorGridChart() {
            return document.body.classList.contains("dark-mode")
                ? "rgba(226, 232, 240, 0.1)"
                : "rgba(51, 65, 85, 0.1)";
        }

        function renderBarChart(canvasId, labels, valores) {
            if (graficosStats[canvasId]) {
                graficosStats[canvasId].destroy();
            }

            graficosStats[canvasId] = new Chart(document.getElementById(canvasId), {
                type: "bar",
                data: {
                    labels: labels,
                    datasets: [{
                        data: valores,
                        backgroundColor: "#2563eb",
                        borderRadius: 4,
                        maxBarThickness: 40
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: {
                            ticks: { color: colorTextoChart() },
                            grid: { display: false }
                        },
                        y: {
                            beginAtZero: true,
                            ticks: { color: colorTextoChart(), precision: 0 },
                            grid: { color: colorGridChart() }
                        }
                    }
                }
            });
        }

        async function cargarStats() {
            const res = await fetch("/pacientes/estadisticas", {
                headers: {
                    "Authorization": "Bearer " + localStorage.getItem("token")
                }
            });
            const data = await res.json();

            const resumen = document.getElementById("statsResumen");

            resumen.innerHTML = `
                <div class="col">
                    <div class="card shadow-sm p-3 border-0 stat-card">
                        <small class="text-muted">🧑‍⚕️ Total de pacientes</small>
                        <h2>${data.total_pacientes}</h2>
                    </div>
                </div>

                <div class="col">
                    <div class="card shadow-sm p-3 border-0 stat-card">
                        <small class="text-muted">⏰ Sin seguimiento (+6 meses)</small>
                        <h2>${data.pacientes_sin_seguimiento}</h2>
                    </div>
                </div>
            `;

            renderBarChart(
                "chartDiagnosticos",
                data.top_diagnosticos.map(d => d.label),
                data.top_diagnosticos.map(d => d.cantidad)
            );

            renderBarChart(
                "chartRangoEtario",
                data.rango_etario.map(r => r.rango),
                data.rango_etario.map(r => r.cantidad)
            );

            renderBarChart(
                "chartLocalidades",
                data.top_localidades.map(l => l.label),
                data.top_localidades.map(l => l.cantidad)
            );

            renderBarChart(
                "chartObrasSociales",
                data.top_obras_sociales.map(o => o.label),
                data.top_obras_sociales.map(o => o.cantidad)
            );

            renderBarChart(
                "chartAltasPorMes",
                data.pacientes_nuevos_por_mes.map(m => m.mes),
                data.pacientes_nuevos_por_mes.map(m => m.cantidad)
            );
        }

        function eliminarPaciente(id) {

            mostrarConfirm("¿Eliminar paciente?", async () => {

                const res = await fetch(`/pacientes/${id}`, {
                    method: "DELETE",
                    headers: {
                        "Authorization": `Bearer ${localStorage.getItem("token")}`
                    }
                });

                // 🔥 NO intentes parsear JSON acá

                if (res.status !== 200 && res.status !== 204) {
                    mostrarToast("Error al eliminar ❌", "danger");
                    return;
                }

                mostrarToast("Paciente eliminado 🗑");
                cargarPacientes();
            });
        }
        

        async function editarPaciente(id) {
            const res = await fetch(`/pacientes/${id}`, {
                headers: {
                    "Authorization": "Bearer " + localStorage.getItem("token")
                }
            });
            const data = await res.json();

            const p = data.paciente;

            // cargar datos
            document.getElementById("edit_telefono").value = p.telefono || "";
            document.getElementById("edit_localidad").value = p.localidad || "";
            document.getElementById("edit_obra_social").value = p.obra_social || "";
            document.getElementById("edit_numero_afiliado").value = p.numero_afiliado || "";
            document.getElementById("edit_sangrados").value = p.sangrados || "";
            document.getElementById("edit_trombosis").value = p.trombosis || "";
            document.getElementById("edit_alergias").value = p.alergias || "";
            document.getElementById("edit_vacunas").value = p.vacunas || "";
            document.getElementById("edit_gestas").value = p.gestas || "";
            document.getElementById("edit_medico_cabecera").value = p.medico_cabecera || "";
            document.getElementById("edit_fim_descriptivo").value = p.fim_descriptivo || "";

            document.getElementById("edit_peso").value = p.peso ?? "";
            document.getElementById("edit_talla").value = p.talla ?? "";
            document.getElementById("edit_imc").value = p.imc ?? "";
            document.getElementById("edit_ocupacion").value = p.ocupacion || "";
            document.getElementById("edit_diagnostico_principal").value = p.diagnostico_principal || "";
            document.getElementById("edit_habitos").value = p.habitos || "";
            document.getElementById("edit_medicacion_habitual").value = p.medicacion_habitual || "";
            document.getElementById("edit_cirugias").value = p.cirugias || "";
            document.getElementById("edit_transfusiones").value = p.transfusiones || "";
            document.getElementById("edit_antecedentes_personales").value = p.antecedentes_personales || "";
            document.getElementById("edit_antecedentes_familiares").value = p.antecedentes_familiares || "";

            window.pacienteEditando = id;

            // 🔥 ESTO ES LO QUE ABRE EL MODAL
            const modal = new bootstrap.Modal(document.getElementById('modalPaciente'));
            modal.show();
        }

        function getValueNumber(id) {
            const valor = document.getElementById(id).value;
            return valor === "" ? null : parseFloat(valor);
        }

        function calcularImc(peso, talla) {
            if (!peso || !talla) return null;
            const tallaM = talla / 100;
            if (tallaM <= 0) return null;
            return Math.round((peso / (tallaM * tallaM)) * 100) / 100;
        }

        function actualizarImcModal() {
            const peso = parseFloat(document.getElementById("edit_peso").value);
            const talla = parseFloat(document.getElementById("edit_talla").value);
            const imc = calcularImc(peso, talla);
            document.getElementById("edit_imc").value = imc ?? "";
        }

        async function guardarEdicion() {

            const paciente = {
                telefono: document.getElementById("edit_telefono").value,
                localidad: document.getElementById("edit_localidad").value,

                obra_social: document.getElementById("edit_obra_social").value,
                numero_afiliado: document.getElementById("edit_numero_afiliado").value,

                sangrados: document.getElementById("edit_sangrados").value,
                trombosis: document.getElementById("edit_trombosis").value,
                alergias: document.getElementById("edit_alergias").value,
                vacunas: document.getElementById("edit_vacunas").value,
                gestas: document.getElementById("edit_gestas").value,
                medico_cabecera: document.getElementById("edit_medico_cabecera").value,
                fim_descriptivo: document.getElementById("edit_fim_descriptivo").value,

                peso: getValueNumber("edit_peso"),
                talla: getValueNumber("edit_talla"),
                ocupacion: document.getElementById("edit_ocupacion").value,
                diagnostico_principal: document.getElementById("edit_diagnostico_principal").value,
                habitos: document.getElementById("edit_habitos").value,
                medicacion_habitual: document.getElementById("edit_medicacion_habitual").value,
                cirugias: document.getElementById("edit_cirugias").value,
                transfusiones: document.getElementById("edit_transfusiones").value,
                antecedentes_personales: document.getElementById("edit_antecedentes_personales").value,
                antecedentes_familiares: document.getElementById("edit_antecedentes_familiares").value
            };

            const res = await fetch(`/pacientes/${window.pacienteEditando}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + localStorage.getItem("token")
                },
                body: JSON.stringify(paciente)
            });
            const data = await res.json();

            if (!res.ok) {
                mostrarToast(data.detail || "Error ❌", "danger");
                return;
            }

            // cerrar modal
            const modal = bootstrap.Modal.getInstance(document.getElementById('modalPaciente'));
            modal.hide();

            mostrarToast("Paciente actualizado ✏️");

            cargarPacientes();
        }

        function verPaciente(id) {
                window.location.href = `/paciente/${id}`;
        }


        cargarStats();
        cargarPacientes();

        function mostrarToast(mensaje, tipo = "success") {

            const toastEl = document.getElementById("toast");
            const toastBody = document.getElementById("toastBody");

            toastBody.innerText = mensaje;

            // cambiar color según tipo
            toastEl.className = `toast align-items-center text-bg-${tipo} border-0`;

            const toast = new bootstrap.Toast(toastEl);
            toast.show();
        }

        function mostrarConfirm(mensaje, callbackConfirm) {

            const modalEl = document.getElementById("confirmModal");
            const modal = new bootstrap.Modal(modalEl);

            document.getElementById("confirmText").innerText = mensaje;

            const btn = document.getElementById("confirmBtn");

            // 🔥 limpiar eventos anteriores
            btn.onclick = null;

            btn.onclick = () => {
                callbackConfirm();
                modal.hide();
            };

            modal.show();
        }

    </script>

</body>
</html>
