    <script>

        document.addEventListener("DOMContentLoaded", () => {
            aplicarModo();
        });

        function logout() {
            localStorage.removeItem("token");
            window.location.href = "/login";
        }

        let limiteTurnos = 5;

        const TAMANO_PAGINA_TURNOS_RECIENTES = 5;
        let paginaTurnosRecientes = 0;

        let filtroActual = "todos";

        function formatearFecha(fecha) {
            return new Date(fecha).toLocaleString("es-AR", {
                timeZone: "America/Argentina/Buenos_Aires",
                day: "2-digit",
                month: "2-digit",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit",
                hour12: false
            });
        }
        const CANTIDAD_INICIAL_PACIENTES = 5;
        let pacientesActuales = [];
        let pacientesMostrados = CANTIDAD_INICIAL_PACIENTES;

        async function cargarPacientes(search = "") {
            const res = await fetch(`/pacientes?search=${search}`, {
                headers: {
                    "Authorization": "Bearer " + localStorage.getItem("token")
                }
            });
            pacientesActuales = await res.json();
            pacientesMostrados = CANTIDAD_INICIAL_PACIENTES;
            renderizarListaPacientes();
        }

        function renderizarListaPacientes() {
            const lista = document.getElementById("lista");

            if (pacientesActuales.length === 0) {
                lista.innerHTML = `
                    <li class="list-group-item text-center text-muted">
                        No se encontraron pacientes
                    </li>
                `;
                return;
            }
            lista.innerHTML = "";

            pacientesActuales.slice(0, pacientesMostrados).forEach(p => {
                const item = document.createElement("li");
                item.className = "list-group-item";
                item.innerHTML = `
                    <div class="d-flex justify-content-between align-items-center">

                        <div onclick="verPaciente(${p.id})" style="cursor:pointer;">
                            <strong>${p.nombre} ${p.apellido}</strong><br>
                            <small>DNI: ${p.dni}</small>
                        </div>

                        <div>
                            <button class="btn btn-sm btn-warning" onclick="editarPaciente(${p.id})">✏️</button>
                            <button class="btn btn-sm btn-danger" onclick="eliminarPaciente(${p.id})">🗑️</button>
                        </div>

                    </div>
                `;

                /*item.onclick = () => {
                    window.location.href = `/paciente/${p.id}`;
                };*/

                lista.appendChild(item);
            });

            const restantes = pacientesActuales.length - pacientesMostrados;
            const hayMenosQueMostrar = pacientesMostrados > CANTIDAD_INICIAL_PACIENTES;
            if (restantes > 0 || hayMenosQueMostrar) {
                const item = document.createElement("li");
                item.className = "list-group-item text-center d-flex justify-content-center gap-3";
                item.innerHTML = `
                    ${restantes > 0 ? `<a href="#" onclick="mostrarMasPacientes(); return false;">Ver más pacientes (${restantes} más)</a>` : ""}
                    ${hayMenosQueMostrar ? `<a href="#" onclick="mostrarMenosPacientes(); return false;">Ver menos</a>` : ""}
                `;
                lista.appendChild(item);
            }
        }

        function mostrarMasPacientes() {
            pacientesMostrados = Math.min(pacientesMostrados + CANTIDAD_INICIAL_PACIENTES, pacientesActuales.length);
            renderizarListaPacientes();
        }

        function mostrarMenosPacientes() {
            pacientesMostrados = Math.max(pacientesMostrados - CANTIDAD_INICIAL_PACIENTES, CANTIDAD_INICIAL_PACIENTES);
            renderizarListaPacientes();
        }

        document.getElementById("search").addEventListener("input", (e) => {
            cargarPacientes(e.target.value);
        });

        async function cargarTurnosRecientes() {
            const skip = paginaTurnosRecientes * TAMANO_PAGINA_TURNOS_RECIENTES;
            const res = await fetch(`/turnos/recientes?skip=${skip}&limit=${TAMANO_PAGINA_TURNOS_RECIENTES}`, {
                headers: {
                    "Authorization": "Bearer " + localStorage.getItem("token")
                }
            });
            const data = await res.json();

            // El total puede ser multiplo exacto del tamaño de pagina: la
            // ultima pagina "llena" no alcanza a saber que no hay una
            // siguiente hasta pedirla. Si vino vacia, no quedarse mostrando
            // una lista en blanco: volver a la pagina anterior.
            if (data.length === 0 && paginaTurnosRecientes > 0) {
                paginaTurnosRecientes--;
                document.getElementById("btnVerMasTurnosRecientes").style.display = "none";
                return;
            }

            const lista = document.getElementById("ultimosTurnos");
            lista.innerHTML = "";

            data.forEach(t => {
                const li = document.createElement("li");
                const nombre = t.paciente
                    ? `${t.paciente.nombre} ${t.paciente.apellido}`
                    : (t.nombre_temp || "Sin paciente");

                li.className = "list-group-item";

                li.innerHTML = `
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <strong class="text-capitalize">${nombre}</strong><br>
                            <small class="text-muted">${formatearFecha(t.fecha)}</small>
                        </div>

                        <div>
                            ${
                                t.estado === "pendiente"
                                ? `<span class="badge bg-warning text-dark">Pendiente</span>`
                                : `<span class="badge bg-success">Atendido</span>`
                            }
                        </div>
                    </div>
                
                    <div class="turno-fecha">
                        ${tiempoRelativo(t.fecha)}
                    </div>
                `;

                li.onclick = () => {
                    if (t.paciente_id) {
                        window.location.href = `/paciente/${t.paciente_id}`;
                    }
                };

                lista.appendChild(li);
            });

            document.getElementById("btnVerMenosTurnosRecientes").style.display =
                paginaTurnosRecientes > 0 ? "inline-block" : "none";

            // Pagina llena -> puede haber mas. Pagina corta (o vacia) ->
            // no hay forma de saberlo sin un COUNT aparte, asi que se
            // asume que no hay mas y se oculta "Ver más".
            document.getElementById("btnVerMasTurnosRecientes").style.display =
                data.length === TAMANO_PAGINA_TURNOS_RECIENTES ? "inline-block" : "none";
        }

        function verMasTurnosRecientes() {
            paginaTurnosRecientes++;
            cargarTurnosRecientes();
        }

        function verMenosTurnosRecientes() {
            if (paginaTurnosRecientes === 0) return;
            paginaTurnosRecientes--;
            cargarTurnosRecientes();
        }


        async function cargarTurnosHoy() {
            const res = await fetch("/turnos/hoy", {
                headers: {
                    "Authorization": "Bearer " + localStorage.getItem("token")
                }
            });
            const data = await res.json();

            const lista = document.getElementById("turnosHoy");
            lista.innerHTML = "";

            data.slice(0, limiteTurnos).forEach(t => {

                if (filtroActual !== "todos" && t.estado !== filtroActual) {
                    return;
                }

                const li = document.createElement("li"); // 🔥 FALTABA ESTO

                const nombre = t.paciente
                    ? `${t.paciente.nombre} ${t.paciente.apellido}`
                    : (t.nombre_temp || "Sin paciente");

                li.className = "list-group-item";

                li.innerHTML = `
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <strong class="text-capitalize">${nombre}</strong><br>
                            <small class="text-muted">${formatearFecha(t.fecha)}</small>
                        </div>

                        <div>
                            ${
                                t.estado === "pendiente"
                                ? `<span class="badge bg-warning text-dark">Pendiente</span>`
                                : `<span class="badge bg-success">Atendido</span>`
                            }
                        </div>
                    </div>
                `;

                if (t.estado === "pendiente") {
                    li.style.borderLeft = "4px solid orange";
                }

                if (t.estado === "atendido") {
                    li.style.borderLeft = "4px solid green";
                }

                li.onclick = () => {
                    if (t.paciente_id) {
                        window.location.href = `/paciente/${t.paciente_id}`;
                    }
                };

                lista.appendChild(li);
            });
        }


        async function cargarStats() {
            const res = await fetch("/turnos/stats", {
                headers: {
                    "Authorization": "Bearer " + localStorage.getItem("token")
                }
            });
            const data = await res.json();

            const stats = document.getElementById("stats");

            stats.innerHTML = `
                <div class="col-md-3">
                    <div class="card shadow-sm p-3 border-0 stat-card" onclick="cambiarFiltro('todos')">
                        <small class="text-muted">📅 Hoy</small>
                        <h2>${data.total}</h2>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card shadow-sm p-3 border-0 stat-card" onclick="cambiarFiltro('pendiente')">
                        <small class="text-warning">🟡 Pendientes</small>
                        <h2>${data.pendientes}</h2>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card shadow-sm p-3 border-0 stat-card" onclick="cambiarFiltro('atendido')">
                        <small class="text-success">🟢 Atendidos</small>
                        <h2>${data.atendidos}</h2>
                    </div>
                </div>

                <!-- 🔥 NUEVA CARD -->
                <div class="col-md-3">
                    <div class="card shadow-sm p-3 border-0 stat-card agenda-card"
                        onclick="window.location.href='/agenda'">

                        <small class="text-muted">📅 Agenda</small>
                        <h4>Ver agenda</h4>

                    </div>
                </div>
            `;
        }
        

        function cambiarFiltro(filtro) {
            filtroActual = filtro;
            cargarTurnosHoy();
        }

        function eliminarPaciente(id) {

            mostrarConfirm("¿Eliminar paciente?", async () => {

                const res = await fetch(`/pacientes/${id}`, {
                    method: "DELETE",
                    headers: {
                        "Authorization": `Bearer ${localStorage.getItem("token")}`
                    }
                });

                // 🔥 NO intentes parsear JSON acá

                if (res.status !== 200 && res.status !== 204) {
                    mostrarToast("Error al eliminar ❌", "danger");
                    return;
                }

                mostrarToast("Paciente eliminado 🗑");
                cargarPacientes();
            });
        }
        

        async function editarPaciente(id) {
            const res = await fetch(`/pacientes/${id}`, {
                headers: {
                    "Authorization": "Bearer " + localStorage.getItem("token")
                }
            });
            const data = await res.json();

            const p = data.paciente;

            // cargar datos
            document.getElementById("edit_telefono").value = p.telefono || "";
            document.getElementById("edit_localidad").value = p.localidad || "";
            document.getElementById("edit_obra_social").value = p.obra_social || "";
            document.getElementById("edit_numero_afiliado").value = p.numero_afiliado || "";
            document.getElementById("edit_alergias").value = p.alergias || "";
            document.getElementById("edit_medico_cabecera").value = p.medico_cabecera || "";

            await cargarCamposEspecialidad("camposEspecialidadModal", p.datos_clinicos || {});

            document.getElementById("edit_peso").value = p.peso ?? "";
            document.getElementById("edit_talla").value = p.talla ?? "";
            document.getElementById("edit_imc").value = p.imc ?? "";
            document.getElementById("edit_ocupacion").value = p.ocupacion || "";
            document.getElementById("edit_diagnostico_principal").value = p.diagnostico_principal || "";
            document.getElementById("edit_habitos").value = p.habitos || "";
            document.getElementById("edit_medicacion_habitual").value = p.medicacion_habitual || "";
            document.getElementById("edit_cirugias").value = p.cirugias || "";
            document.getElementById("edit_transfusiones").value = p.transfusiones || "";
            document.getElementById("edit_antecedentes_personales").value = p.antecedentes_personales || "";
            document.getElementById("edit_antecedentes_familiares").value = p.antecedentes_familiares || "";

            window.pacienteEditando = id;

            // 🔥 ESTO ES LO QUE ABRE EL MODAL
            const modal = new bootstrap.Modal(document.getElementById('modalPaciente'));
            modal.show();
        }

        function getValueNumber(id) {
            const valor = document.getElementById(id).value;
            return valor === "" ? null : parseFloat(valor);
        }

        function calcularImc(peso, talla) {
            if (!peso || !talla) return null;
            const tallaM = talla / 100;
            if (tallaM <= 0) return null;
            return Math.round((peso / (tallaM * tallaM)) * 100) / 100;
        }

        function actualizarImcModal() {
            const peso = parseFloat(document.getElementById("edit_peso").value);
            const talla = parseFloat(document.getElementById("edit_talla").value);
            const imc = calcularImc(peso, talla);
            document.getElementById("edit_imc").value = imc ?? "";
        }

        async function guardarEdicion() {

            const paciente = {
                telefono: document.getElementById("edit_telefono").value,
                localidad: document.getElementById("edit_localidad").value,

                obra_social: document.getElementById("edit_obra_social").value,
                numero_afiliado: document.getElementById("edit_numero_afiliado").value,

                alergias: document.getElementById("edit_alergias").value,
                medico_cabecera: document.getElementById("edit_medico_cabecera").value,
                datos_clinicos: leerCamposEspecialidad("camposEspecialidadModal"),

                peso: getValueNumber("edit_peso"),
                talla: getValueNumber("edit_talla"),
                ocupacion: document.getElementById("edit_ocupacion").value,
                diagnostico_principal: document.getElementById("edit_diagnostico_principal").value,
                habitos: document.getElementById("edit_habitos").value,
                medicacion_habitual: document.getElementById("edit_medicacion_habitual").value,
                cirugias: document.getElementById("edit_cirugias").value,
                transfusiones: document.getElementById("edit_transfusiones").value,
                antecedentes_personales: document.getElementById("edit_antecedentes_personales").value,
                antecedentes_familiares: document.getElementById("edit_antecedentes_familiares").value
            };

            const res = await fetch(`/pacientes/${window.pacienteEditando}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + localStorage.getItem("token")
                },
                body: JSON.stringify(paciente)
            });
            const data = await res.json();

            if (!res.ok) {
                mostrarToast(data.detail || "Error ❌", "danger");
                return;
            }

            // cerrar modal
            const modal = bootstrap.Modal.getInstance(document.getElementById('modalPaciente'));
            modal.hide();

            mostrarToast("Paciente actualizado ✏️");

            cargarPacientes();
        }

        function verPaciente(id) {
                window.location.href = `/paciente/${id}`;
        }

        function mostrarToast(mensaje, tipo = "success") {

            const toastEl = document.getElementById("toast");
            const toastBody = document.getElementById("toastBody");

            toastBody.innerText = mensaje;

            // cambiar color según tipo
            toastEl.className = `toast align-items-center text-bg-${tipo} border-0`;

            const toast = new bootstrap.Toast(toastEl);
            toast.show();
        }

        function verMasTurnosHoy() {
            limiteTurnos += 5;
            cargarTurnosHoy();
        }

        function tiempoRelativo(fecha) {
            const ahora = new Date();
            const f = new Date(fecha);

            const diffMs = f - ahora; // 🔥 ahora invertido (para futuro)
            const diffMin = Math.floor(Math.abs(diffMs) / 60000);
            const diffHoras = Math.floor(diffMin / 60);
            const diffDias = Math.floor(diffHoras / 24);

            // 🔥 FUTURO
            if (diffMs > 0) {
                if (diffMin < 60) return `en ${diffMin} min`;
                if (diffHoras < 24) return `en ${diffHoras} h`;
                return `en ${diffDias} días`;
            }

            // 🔥 PASADO
            if (diffMin < 1) return "recién";
            if (diffMin < 60) return `hace ${diffMin} min`;
            if (diffHoras < 24) return `hace ${diffHoras} h`;
            return `hace ${diffDias} días`;
        }

        setInterval(() => {
            cargarTurnosRecientes(); // 🔥 refresca solo esa parte
        }, 60000);

        function mostrarConfirm(mensaje, callbackConfirm) {

            const modalEl = document.getElementById("confirmModal");
            const modal = new bootstrap.Modal(modalEl);

            document.getElementById("confirmText").innerText = mensaje;

            const btn = document.getElementById("confirmBtn");

            // 🔥 limpiar eventos anteriores
            btn.onclick = null;

            btn.onclick = () => {
                callbackConfirm();
                modal.hide();
            };

            modal.show();
        }

    </script>

</body>
</html>
