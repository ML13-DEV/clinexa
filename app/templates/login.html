<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>DataSoma Health</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            padding: 30px;
            background: #111827;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .login-title {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.8rem;
            font-weight: bold;
        }

        .form-control {
            background-color: #1f2937;
            border: none;
            color: white;
        }

        .form-control:focus {
            background-color: #1f2937;
            color: white;
            box-shadow: none;
        }

        .btn-primary {
            background-color: #3b82f6;
            border: none;
        }

        .btn-primary:hover {
            background-color: #2563eb;
        }

        .error {
            color: #f87171;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>

<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="login-card text-center"> 
    
        <!-- Contenedor con d-flex y justify-content-center para centrar el logo -->
        <div class="mb-4 d-flex justify-content-center">
            <img src="static/img/DataSoma_Logo2.png" 
                alt="DataSoma Health Logo" 
                class="img-fluid" 
                style="max-width: 300px; height: auto; display: block;">

            
        </div>

        <h3 class="login-title">Ingrese sus datos</h3>

        <input id="username" class="form-control mb-3" placeholder="Usuario">
        <input id="password" type="password" class="form-control mb-3" placeholder="Contraseña">

        <button class="btn btn-primary w-100" onclick="login()">Ingresar</button>

        <div id="error" class="error"></div>

    </div>

    <script>

    async function login() {

        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        const res = await fetch("/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (!res.ok) {
            document.getElementById("error").innerText = "Credenciales incorrectas";
            return;
        }

        localStorage.setItem("token", data.access_token);

        window.location.href = "/";
    }

    // 🔥 AUTO LOGIN
    if (localStorage.getItem("token")) {
        window.location.href = "/";
    }

    </script>

</body>
</html>
