<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>DataSoma Health - Restablecer contraseña</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            border-radius: 20px;
            padding: 30px;
            background: #111827;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .login-title {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.6rem;
            font-weight: bold;
        }

        .form-control {
            background-color: #1f2937;
            border: none;
            color: white;
        }

        .form-control:focus {
            background-color: #1f2937;
            color: white;
            box-shadow: none;
        }

        .btn-primary {
            background-color: #3b82f6;
            border: none;
        }

        .btn-primary:hover {
            background-color: #2563eb;
        }

        .error {
            color: #f87171;
            text-align: center;
            margin-top: 10px;
        }

        .exito {
            color: #4ade80;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>

<body class="py-4">

    <div class="login-card text-center">

        <div class="mb-4 d-flex justify-content-center">
            <img src="static/img/DataSoma_Logo2.png"
                alt="DataSoma Health Logo"
                class="img-fluid"
                style="max-width: 260px; height: auto; display: block;">
        </div>

        <h3 class="login-title">Elegí una nueva contraseña</h3>

        <div id="formReset">
            <input id="password" type="password" class="form-control mb-3" placeholder="Contraseña nueva">
            <input id="password_confirmar" type="password" class="form-control mb-3" placeholder="Repetí la contraseña">
            <button class="btn btn-primary w-100" onclick="confirmar()">Cambiar contraseña</button>
        </div>

        <div id="error" class="error"></div>
        <div id="exito" class="exito" style="display:none;">
            Contraseña actualizada. <a href="/login" class="text-light">Iniciar sesión</a>
        </div>

        <div id="sinToken" style="display:none;">
            <p class="error">Este link no es válido. Pedí uno nuevo.</p>
            <a href="/olvide-password" class="text-light small">Pedir un nuevo link</a>
        </div>

    </div>

    <script>
        const token = new URLSearchParams(window.location.search).get("token");

        if (!token) {
            document.getElementById("formReset").style.display = "none";
            document.getElementById("sinToken").style.display = "block";
        }

        async function confirmar() {
            const password = document.getElementById("password").value;
            const password_confirmar = document.getElementById("password_confirmar").value;
            const errorEl = document.getElementById("error");
            errorEl.innerText = "";

            if (!password || password.length < 6) {
                errorEl.innerText = "La contraseña debe tener al menos 6 caracteres";
                return;
            }

            if (password !== password_confirmar) {
                errorEl.innerText = "Las contraseñas no coinciden";
                return;
            }

            const res = await fetch("/reset-password", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ token, password_nueva: password })
            });

            const data = await res.json();

            if (!res.ok) {
                errorEl.innerText = data.detail || "No se pudo cambiar la contraseña";
                return;
            }

            document.getElementById("formReset").style.display = "none";
            document.getElementById("exito").style.display = "block";
        }
    </script>

</body>
</html>
