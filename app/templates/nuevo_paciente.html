<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nuevo Paciente</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
    <script src="/static/js/darkmode.js"></script>

    <script>
        if (!localStorage.getItem("token")) {
            window.location.href = "/login";
        }
    </script>
</head>

<body class="container-fluid py-4">
    <div class="container">

    <!-- 🔙 Volver -->
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3 mb-4">
        <a href="/" class="btn btn-outline-secondary">← Volver</a>

        <div class="d-flex gap-2">
            <button onclick="logout()" class="btn btn-danger">Salir</button>

            <button class="btn btn-sm btn-secondary" onclick="toggleDarkMode()">
                🌙
            </button>
        </div>
    </div>

    <h2 class="mb-4">Nuevo Paciente</h2>

    <div class="card shadow-sm p-4 border-0">

        <!-- 🧍 DATOS PERSONALES -->
        <h5 class="mb-3">Datos personales</h5>

        <div class="row g-2">
            <div class="col-12 col-md-6">
                <input id="nombre" class="form-control" placeholder="Nombre">
            </div>
            <div class="col-12 col-md-6">
                <input id="apellido" class="form-control" placeholder="Apellido">
            </div>
        </div>

        <div class="row g-2">
            <div class="col-12 col-md-4">
                <input id="dni" class="form-control" placeholder="DNI">
            </div>
            <div class="col-12 col-md-4">
                <input id="fecha" type="date" class="form-control">
            </div>
            <div class="col-12 col-md-4">
                <input id="telefono" class="form-control" placeholder="Teléfono">
            </div>
        </div>

        <div class="row g-2 mt-1">
            <div class="col-12 col-md-4">
                <input id="localidad" class="form-control" placeholder="Localidad">
            </div>
        </div>

        <hr>

        <!-- 🏥 OBRA SOCIAL -->
        <h5 class="mb-3">Obra social</h5>

        <div class="row g-2">
            <div class="col-12 col-md-6">
                <input id="obra_social" class="form-control" placeholder="Obra social">
            </div>
            <div class="col-12 col-md-6">
                <input id="numero_afiliado" class="form-control" placeholder="Número afiliado">
            </div>
        </div>

        <hr>

        <!-- 🩸 DATOS MÉDICOS -->
        <h5 class="mb-3">Datos médicos</h5>

        <textarea id="sangrados" class="form-control mb-2" placeholder="Sangrados"></textarea>
        <textarea id="trombosis" class="form-control mb-2" placeholder="Trombosis"></textarea>
        <textarea id="alergias" class="form-control mb-2" placeholder="Alergias"></textarea>
        <textarea id="vacunas" class="form-control mb-2" placeholder="Vacunas"></textarea>
        <textarea id="gestas" class="form-control mb-2" placeholder="Gestas"></textarea>

        <input id="medico_cabecera" class="form-control mb-2" placeholder="Médico de cabecera">

        <textarea id="fim_descriptivo" class="form-control mb-3" placeholder="FIM descriptivo"></textarea>

        <hr>

        <!-- 🩺 DATOS CLÍNICOS -->
        <h5 class="mb-3">Datos clínicos</h5>

        <div class="row g-2">
            <div class="col-12 col-md-4">
                <input id="peso" type="number" step="0.1" class="form-control" placeholder="Peso (kg)" oninput="actualizarImc()">
            </div>
            <div class="col-12 col-md-4">
                <input id="talla" type="number" step="0.1" class="form-control" placeholder="Talla (cm)" oninput="actualizarImc()">
            </div>
            <div class="col-12 col-md-4">
                <input id="imc" class="form-control" placeholder="IMC" readonly>
            </div>
        </div>

        <div class="row g-2 mt-1">
            <div class="col-12 col-md-6">
                <input id="ocupacion" class="form-control" placeholder="Ocupación">
            </div>
        </div>

        <textarea id="diagnostico_principal" class="form-control mb-2 mt-2" placeholder="Diagnóstico principal"></textarea>
        <textarea id="habitos" class="form-control mb-2" placeholder="Hábitos"></textarea>
        <textarea id="medicacion_habitual" class="form-control mb-2" placeholder="Medicación habitual"></textarea>
        <textarea id="cirugias" class="form-control mb-2" placeholder="Cirugías"></textarea>
        <textarea id="transfusiones" class="form-control mb-2" placeholder="Transfusiones"></textarea>
        <textarea id="antecedentes_personales" class="form-control mb-2" placeholder="Antecedentes personales"></textarea>
        <textarea id="antecedentes_familiares" class="form-control mb-3" placeholder="Antecedentes familiares"></textarea>

        <div class="text-end">
            <button class="btn btn-success w-100 w-md-auto" onclick="crearPaciente()">
                Guardar paciente
            </button>
        </div>

    </div>

    <script>


        document.addEventListener("DOMContentLoaded", () => {
            aplicarModo();
        });

        function logout() {
            localStorage.removeItem("token");
            window.location.href = "/login";
        }

        function calcularImc(peso, talla) {
            if (!peso || !talla) return null;
            const tallaM = talla / 100;
            if (tallaM <= 0) return null;
            return Math.round((peso / (tallaM * tallaM)) * 100) / 100;
        }

        function actualizarImc() {
            const peso = parseFloat(document.getElementById("peso").value);
            const talla = parseFloat(document.getElementById("talla").value);
            const imc = calcularImc(peso, talla);
            document.getElementById("imc").value = imc ?? "";
        }

        function mostrarToast(msg, tipo="success") {

            const toast = document.createElement("div");
            toast.className = `position-fixed bottom-0 end-0 m-3 p-3 text-white bg-${tipo}`;
            toast.style.zIndex = 9999;
            toast.innerText = msg;

            document.body.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 2500);
        }


        function getValueNumber(id) {
            const valor = document.getElementById(id).value;
            return valor === "" ? null : parseFloat(valor);
        }

        async function crearPaciente() {

            const paciente = {
                nombre: document.getElementById("nombre").value,
                apellido: document.getElementById("apellido").value,
                dni: document.getElementById("dni").value,
                fecha_nacimiento: document.getElementById("fecha").value,
                telefono: document.getElementById("telefono").value,
                localidad: document.getElementById("localidad").value,

                obra_social: document.getElementById("obra_social").value,
                numero_afiliado: document.getElementById("numero_afiliado").value,

                sangrados: document.getElementById("sangrados").value,
                trombosis: document.getElementById("trombosis").value,
                alergias: document.getElementById("alergias").value,
                vacunas: document.getElementById("vacunas").value,
                gestas: document.getElementById("gestas").value,
                medico_cabecera: document.getElementById("medico_cabecera").value,
                fim_descriptivo: document.getElementById("fim_descriptivo").value,

                peso: getValueNumber("peso"),
                talla: getValueNumber("talla"),
                diagnostico_principal: document.getElementById("diagnostico_principal").value,
                ocupacion: document.getElementById("ocupacion").value,
                habitos: document.getElementById("habitos").value,
                medicacion_habitual: document.getElementById("medicacion_habitual").value,
                cirugias: document.getElementById("cirugias").value,
                transfusiones: document.getElementById("transfusiones").value,
                antecedentes_personales: document.getElementById("antecedentes_personales").value,
                antecedentes_familiares: document.getElementById("antecedentes_familiares").value
            };

            const res = await fetch("/pacientes", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + localStorage.getItem("token")
                },
                body: JSON.stringify(paciente)
            });

            const data = await res.json();

            if (!res.ok) {
                mostrarToast(data.detail || "Error ❌", "danger");
                return;
            }

            mostrarToast("Paciente creado correctamente ✅");

            window.location.href = "/";
        }

    </script>

</body>
</html>
