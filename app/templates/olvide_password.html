<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>DataSoma Health - Olvidé mi contraseña</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            border-radius: 20px;
            padding: 30px;
            background: #111827;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .login-title {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.6rem;
            font-weight: bold;
        }

        .form-control {
            background-color: #1f2937;
            border: none;
            color: white;
        }

        .form-control:focus {
            background-color: #1f2937;
            color: white;
            box-shadow: none;
        }

        .btn-primary {
            background-color: #3b82f6;
            border: none;
        }

        .btn-primary:hover {
            background-color: #2563eb;
        }

        .error {
            color: #f87171;
            text-align: center;
            margin-top: 10px;
        }

        .exito {
            color: #4ade80;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>

<body class="py-4">

    <div class="login-card text-center">

        <div class="mb-4 d-flex justify-content-center">
            <img src="static/img/DataSoma_Logo2.png"
                alt="DataSoma Health Logo"
                class="img-fluid"
                style="max-width: 260px; height: auto; display: block;">
        </div>

        <h3 class="login-title">¿Olvidaste tu contraseña?</h3>

        <div id="formSolicitud">
            <p class="small text-secondary">Ingresá tu usuario o email y, si tenés una cuenta con un email cargado, te mandamos un link para elegir una nueva contraseña.</p>
            <input id="identificador" class="form-control mb-3" placeholder="Usuario o email">
            <button class="btn btn-primary w-100" onclick="solicitar()">Enviar</button>
        </div>

        <div id="error" class="error"></div>
        <div id="exito" class="exito" style="display:none;">
            Si el usuario existe y tiene un email cargado, te enviamos instrucciones.
        </div>

        <div class="mt-3 small">
            <a href="/login" class="text-light">Volver a login</a>
        </div>

    </div>

    <script>
        async function solicitar() {
            const identificador = document.getElementById("identificador").value.trim();
            const errorEl = document.getElementById("error");
            errorEl.innerText = "";

            if (!identificador) {
                errorEl.innerText = "Ingresá tu usuario o email";
                return;
            }

            const res = await fetch("/olvide-password", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ identificador })
            });

            if (!res.ok) {
                const data = await res.json();
                errorEl.innerText = data.detail || "No se pudo procesar la solicitud";
                return;
            }

            document.getElementById("formSolicitud").style.display = "none";
            document.getElementById("exito").style.display = "block";
        }
    </script>

</body>
</html>
